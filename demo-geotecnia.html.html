  }
  const node = target.closest("[data-action]") || target;
  const action = node.dataset ? node.dataset.action : "";
  if (target.id === "hole-select" || action === "set-hole") {
    onHole(target.value);
    return;
  }
  if (action === "include-flash") {
    const flashReports = getState().flashReports.map((report) => report.id === node.dataset.id ? Object.assign({}, report, { included: report.included === false }) : report);
    setState({ flashReports: flashReports, closures: readCierreClosures() }, { refresh: ["cierre", "dashboard"] });
    return;
  }
  if (action === "test-status") {
    const tests = getState().tests.map((test) => test.id === node.dataset.id ? Object.assign({}, test, { status: target.value }) : test);
    setState({ tests: tests, closures: readCierreClosures() }, { refresh: ["cierre", "dashboard"] });
    return;
  }
  if (action === "reco-priority") {
    const recommendations = getState().recommendations.map((item) => item.id === node.dataset.id ? Object.assign({}, item, { priority: target.value }) : item);
    setState({ recommendations: recommendations, closures: readCierreClosures() }, { refresh: ["cierre"] });
    return;
  }
  if (action === "photo-filter") {
    const ui = JSON.parse(JSON.stringify(getState().ui));
    ui.photoFilters[node.dataset.key] = target.value;
    setState({ ui: ui }, { refresh: ["dashboard"] });
    return;
  }
  if (action === "toggle-check") {
    if (getState().handover) return;
    const checklist = Object.assign({}, getState().checklist);
    checklist[node.dataset.key] = target.checked;
    setState({ checklist: checklist, handoverDraftName: readHandoverName() }, { refresh: ["empalme"] });
    return;
  }
  if (action === "toggle-task") {
    const tasks = getState().tasks.map((task) => task.id === node.dataset.id ? Object.assign({}, task, { done: target.checked }) : task);
    setState({ tasks: tasks }, { refresh: ["empalme", "dashboard"] });
    return;
  }
  if (action === "shift-status") {
    const state = getState();
    const shiftStatus = Object.assign({}, state.shiftStatus);
    const current = Object.assign({}, shiftStatus[state.activeHoleId] || {});
    current[node.dataset.field] = node.dataset.field === "equipmentOk" ? target.value === "si" : target.value;
    shiftStatus[state.activeHoleId] = current;
    setState({ shiftStatus: shiftStatus }, { refresh: ["empalme"] });
  }
}

function onInput(event) {
  const target = event.target;
  if (target.closest("#flash-form")) {
    applyDraftField(target);
    if (workingDraft) workingDraft.pristine = false;
    saveDraftSoon();
    calcSoon();
    return;
  }
  if (target.id === "night-meters" || target.id === "issuer-name") {
    cierreSoon();
    return;
  }
  if (target.id === "handover-name") {
    handoverSoon();
    return;
  }
  if (target.closest("#task-form") && target.name) composer[target.name] = target.value;
  if (target.closest("#instr-form") && target.name === "instr") composer.instr = target.value;
}

function onStore(state, meta) {
  updateChrome(state);
  updateLive(state);
  const refresh = (meta && meta.refresh) || [];
  if (refresh.indexOf("captura") >= 0) renderCaptura(state, ensureWorkingDraft(state));
  if (refresh.indexOf("cierre") >= 0) {
    renderCierre(state);
    window.requestAnimationFrame(resizeCharts);
  }
  if (refresh.indexOf("dashboard") >= 0) {
    renderDashboard(state);
    window.requestAnimationFrame(resizeCharts);
  }
  if (refresh.indexOf("empalme") >= 0) renderEmpalme(state, composer);
  if (meta && meta.saved && meta.saved.ok === false && !quotaWarned) {
    quotaWarned = true;
    showToast("No se pudo guardar en el navegador", "El almacenamiento está lleno o bloqueado. La sesión sigue en memoria.");
  }
}

function bindEvents() {
  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onChange);
  document.addEventListener("submit", (event) => {
    if (event.target.id === "flash-form") {
      event.preventDefault();
      submitFlash();
    } else if (event.target.id === "task-form") {
      event.preventDefault();
      addTask();
    } else if (event.target.id === "instr-form") {
      event.preventDefault();
      addInstr();
    }
  });
  document.addEventListener("dragstart", (event) => {
    const row = event.target.closest("[data-task-id]");
    if (!row || event.target.closest("button, input, select, textarea")) return;
    dragId = row.dataset.taskId;
    if (event.dataTransfer) {
      event.dataTransfer.setData("text/plain", dragId);
      event.dataTransfer.effectAllowed = "move";
    }
  });
  document.addEventListener("dragover", (event) => {
    if (event.target.closest("[data-task-id]")) event.preventDefault();
  });
  document.addEventListener("drop", (event) => {
    const row = event.target.closest("[data-task-id]");
    if (!row || !dragId) return;
    event.preventDefault();
    reorderTasks(dragId, row.dataset.taskId);
    dragId = "";
  });
  document.addEventListener("keydown", (event) => {
    if (lightboxOpen()) {
      if (event.key === "Escape") { event.preventDefault(); closeLightbox(); }
      if (event.key === "ArrowRight") { event.preventDefault(); stepLightbox(1); }
      if (event.key === "ArrowLeft") { event.preventDefault(); stepLightbox(-1); }
      return;
    }
    const modal = document.getElementById("modal-root");
    if (event.key === "Escape" && modal && modal.childElementCount) closeModal();
  });
}

function boot() {
  initState();
  ensureSessionClock();
  bindEvents();
  subscribe(onStore);
  onStore(getState(), { refresh: [getState().activeView], saved: { ok: true } });
}

boot();

       arrow.style.top = "";
       arrow.style.left = "";
       arrow.style.right = "";
       arrow.style.bottom = "";
       if (side === "bottom" || side === "top") {
         var x = rect.left + rect.width / 2 - box.left - 6;
         arrow.style.left = clamp(x, 18, Math.max(18, (box.right - box.left) - 30)) + "px";
         if (side === "bottom") arrow.style.top = "-7px";
         else arrow.style.bottom = "-7px";
         return;
       }
       var y = rect.top + rect.height / 2 - box.top - 6;
       arrow.style.top = clamp(y, 18, Math.max(18, (box.bottom - box.top) - 30)) + "px";
       if (side === "right") arrow.style.left = "-7px";
       else arrow.style.right = "-7px";
     }
   
     function centerCard() {
       var view = viewport();
       var cardW = card.offsetWidth || Math.min(360, view.width - 24);
       var cardH = card.offsetHeight || 220;
       var left = Math.max(MARGIN, (view.width - cardW) / 2);
       var top = Math.max(MARGIN, (view.height - bottomChrome() - cardH) / 2);
       card.style.left = left + "px";
       card.style.top = top + "px";
       arrow.hidden = true;
     }
   
     function layout() {
       if (!open || !card) return;
       var step = STEPS[stepIndex];
       var target = step.target();
       currentTarget = target && target.isConnected ? target : null;
       if (!currentTarget) {
         veil();
         centerCard();
         root.classList.add("is-ready");
         return;
       }
       var raw = currentTarget.getBoundingClientRect();
       if (raw.width < 2 || raw.height < 2) {
         veil();
         centerCard();
         root.classList.add("is-ready");
         return;
       }
       var hole = {
         top: raw.top - PAD,
         left: raw.left - PAD,
         right: raw.right + PAD,
         bottom: raw.bottom + PAD,
         width: raw.width + PAD * 2,
         height: raw.height + PAD * 2
       };
       var cardW = card.offsetWidth;
       var cardH = card.offsetHeight;
       var placed = pickPlacement(hole, cardW, cardH, step.prefer || DEFAULT_PREFER);
       var lit = trimHole(hole, placed);
       placeBlockers(lit);
       placeRing(lit, currentTarget);
       card.style.left = placed.left + "px";
       card.style.top = placed.top + "px";
       placeArrow(placed.side, hole, placed);
       root.classList.add("is-ready");
     }
   
     function requestLayout() {
       if (!open) return;
       window.cancelAnimationFrame(layoutFrame);
       layoutFrame = window.requestAnimationFrame(layout);
     }
   
     function isFixedLike(node) {
       var el = node;
       while (el && el !== document.documentElement) {
         var pos = window.getComputedStyle(el).position;
         if (pos === "fixed" || pos === "sticky") return true;
         el = el.parentElement;
       }
       return false;
     }
   
     function scrollTargetIntoView(node) {
       return new Promise(function (resolve) {
         var rect = node.getBoundingClientRect();
         var fullyVisible = rect.top >= 8 && rect.left >= 8 && rect.bottom <= window.innerHeight - 8 && rect.right <= window.innerWidth - 8;
         if (isFixedLike(node) && fullyVisible) {
           resolve();
           return;
         }
         var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
         var tall = node.offsetHeight > window.innerHeight * 0.72;
         node.scrollIntoView({
           behavior: reduced ? "auto" : "smooth",
           block: tall ? "start" : "center",
           inline: "nearest"
         });
         var start = performance.now();
         var lastTop = null;
         var stable = 0;
         function tick(now) {
           var top = node.getBoundingClientRect().top;
           if (lastTop != null && Math.abs(top - lastTop) < 0.5) stable += 1;
           else stable = 0;
           lastTop = top;
           if (stable >= 4 || now - start > 900) resolve();
           else window.requestAnimationFrame(tick);
         }
         window.requestAnimationFrame(tick);
       });
     }
   
     function ensureView(view) {
       return new Promise(function (resolve) {
         var changed = false;
         if (view && typeof getState === "function" && getState().activeView !== view && typeof navigate === "function") {
           navigate(view);
           changed = true;
         }
         if (!changed) {
           resolve();
           return;
         }
         window.requestAnimationFrame(function () {
           window.requestAnimationFrame(resolve);
         });
       });
     }
   
     function focusForStep(index) {
       if (index === 1) {
         var input = document.getElementById("from-m");
         if (input && !input.disabled) {
           input.focus({ preventScroll: true });
           return;
         }
       }
       if (nextBtn) nextBtn.focus({ preventScroll: true });
     }
   
     function showStep(index) {
       var token = ++generation;
       moving = true;
       stepIndex = index;
       var step = STEPS[index];
       paintCard(step, index);
       syncBusy();
       root.hidden = false;
       veil();
       ensureView(step.view).then(function () {
         if (token !== generation) return null;
         var target = step.target();
         currentTarget = target && target.isConnected ? target : null;
         if (!currentTarget) return null;
         return scrollTargetIntoView(currentTarget);
       }).then(function () {
         if (token !== generation) return;
         layout();
         moving = false;
         syncBusy();
         focusForStep(index);
       }).catch(function () {
         if (token !== generation) return;
         moving = false;
         syncBusy();
         layout();
       });
     }
   
     function go(delta) {
       if (!open || moving) return;
       var next = stepIndex + delta;
       if (next < 0) return;
       if (next >= STEPS.length) {
         finish(false);
         return;
       }
       showStep(next);
     }
   
     function finish(skipped) {
       generation += 1;
       moving = false;
       open = false;
       currentTarget = null;
       if (root) {
         root.classList.remove("is-ready");
         root.hidden = true;
       }
       markCompleted();
       if (!skipped && typeof showToast === "function") {
         showToast("Tour completado", "Puedes volver a abrirlo con el botón de ayuda.");
       }
       if (openedFromButton && launchBtn) {
         openedFromButton = false;
         launchBtn.focus();
       }
     }
   
     function start() {
       if (bootTimer) {
         window.clearTimeout(bootTimer);
         bootTimer = 0;
       }
       open = true;
       if (root) {
         root.hidden = false;
         root.classList.remove("is-ready");
       }
       showStep(0);
     }
   
     function onKeydown(event) {
       if (!open) return;
       var inCard = card && card.contains(document.activeElement);
       if (event.key === "Escape" && inCard) {
         event.preventDefault();
         finish(true);
         return;
       }
       if (!inCard) return;
       if (event.key === "ArrowRight") {
         event.preventDefault();
         go(1);
       } else if (event.key === "ArrowLeft") {
         event.preventDefault();
         go(-1);
       }
     }
   
     function onGuard(event) {
       if (!open) return;
       if (launchBtn && launchBtn.contains(event.target)) return;
       if (card && card.contains(event.target)) return;
       if (currentTarget && currentTarget.contains(event.target)) return;
       event.preventDefault();
       event.stopPropagation();
     }
   
     function bootTour() {
       build();
       launchBtn = document.getElementById("tour-launch");
       if (launchBtn) {
         launchBtn.addEventListener("click", function () {
           openedFromButton = true;
           start();
         });
       }
       document.addEventListener("keydown", onKeydown);
       document.addEventListener("click", onGuard, true);
       document.addEventListener("click", function (event) {
         if (!open || moving || !currentTarget || !currentTarget.contains(event.target)) return;
         var nav = event.target.closest("[data-nav]");
         if (!nav || nav !== currentTarget) return;
         go(1);
       });
       window.addEventListener("resize", requestLayout);
       window.addEventListener("scroll", requestLayout, true);
       if (window.visualViewport) {
         window.visualViewport.addEventListener("resize", requestLayout);
         window.visualViewport.addEventListener("scroll", requestLayout);
       }
       if (typeof subscribe === "function") {
         subscribe(function () {
           if (open) requestLayout();
         });
       }
       if (!isCompleted()) {
         bootTimer = window.setTimeout(function () {
           bootTimer = 0;
           if (!open && !isCompleted()) start();
         }, 500);
       }
     }
   
     bootTour();
   }());
   </script>
</body>
</html>
