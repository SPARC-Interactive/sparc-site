<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1419">
  <title>Supervisión geotécnica · Sparc</title>
  <script>
    try {
      var rawTheme = localStorage.getItem("sparc_geo_demo_v1");
      if (rawTheme && rawTheme.indexOf('"theme":"light"') !== -1) {
        document.documentElement.dataset.theme = "light";
      }
    } catch (error) { /* almacenamiento bloqueado: se queda el tema oscuro */ }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "var(--text)",
            dim: "var(--text-dim)",
            panel: "var(--surface)",
            line: "var(--border)",
            amber: "var(--accent-btn)"
          }
        }
      }
    };
  </script>
  <style>
/* Maqueta de supervisión geotécnica. El tema vive en variables. */

:root {
  --bg: #0f1419;
  --surface: #1a2129;
  --surface-2: #232d38;
  --border: #2f3b47;
  --text: #e6e9ec;
  --text-dim: #9aa7b4;
  --accent: #f5a524;
  --accent-2: #4aa3df;
  --accent-btn: #f5a524;
  --accent-btn-ink: #1a1203;
  --ok: #3fb27f;
  --warn: #f5a524;
  --bad: #e5484d;
  --ok-ink: #b8f0d4;
  --warn-ink: #ffe3ad;
  --bad-ink: #ffd0d2;
  --planned: #9aa7b4;
  --chip-ok-bg: rgba(63, 178, 127, 0.16);
  --chip-warn-bg: rgba(245, 165, 36, 0.16);
  --chip-bad-bg: rgba(229, 72, 77, 0.16);
  --focus: #7cc4ef;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
  --tabbar-h: 64px;
  --sidebar-w: 240px;
  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #e7edf2;
  --border: #d5dee6;
  --text: #15202b;
  --text-dim: #52616e;
  --accent: #8a5a00;
  --accent-2: #1d6fa5;
  --accent-btn: #f5a524;
  --accent-btn-ink: #1a1203;
  --ok: #1f7a52;
  --warn: #8a5a00;
  --bad: #c4232a;
  --ok-ink: #135c3c;
  --warn-ink: #6d4800;
  --bad-ink: #9d1c22;
  --planned: #667684;
  --chip-ok-bg: #e5f6ee;
  --chip-warn-bg: #fff4dc;
  --chip-bad-bg: #fdecee;
  --focus: #1d6fa5;
  --shadow: 0 1px 2px rgba(16, 24, 32, 0.06);
  color-scheme: light;
}

* { box-sizing: border-box; }

html { overflow-x: clip; }

body.app-body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.4;
  overflow-x: clip;
}

button, input, select, textarea { font: inherit; color: inherit; }

:focus { outline: none; }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

[hidden] { display: none !important; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

.icon { width: 20px; height: 20px; flex: 0 0 auto; }

.app-shell { min-height: 100vh; min-width: 0; }

.workspace { min-width: 0; }

.sidebar {
  display: none;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px 12px;
  flex-direction: column;
  gap: 4px;
}

.brand-kicker {
  margin: 0;
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.brand-title { margin: 2px 0 12px; font-size: 16px; font-weight: 700; }

.nav-btn, .tab-btn, .btn, .sync, .icon-btn, .block-sum {
  min-height: 44px;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--text);
  padding: 8px 10px;
  text-align: left;
  cursor: pointer;
}

.nav-btn.is-active {
  background: var(--surface-2);
  box-shadow: inset 3px 0 0 var(--accent-btn);
}

.sidebar-foot { margin-top: auto; padding-top: 12px; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 8px 12px 10px;
}

.topbar::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 3px;
  background: var(--accent-btn);
}

.top-row, .sub-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.top-row { min-height: 44px; }

.project-name {
  margin: 0;
  flex: 1 1 180px;
  min-width: 0;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sub-row { margin-top: 4px; }

.hole-select { flex: 1 1 140px; min-width: 0; }

.context-picks {
  display: flex;
  flex: 1 1 220px;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.date-chip {
  color: var(--text-dim);
  font-size: 13px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface-2);
}

.seg-btn {
  min-height: 44px;
  min-width: 52px;
  padding: 0 12px;
  border: 0;
  background: transparent;
  color: var(--text);
  cursor: pointer;
}

.seg-btn.is-active { background: var(--accent-btn); color: var(--accent-btn-ink); font-weight: 700; }

.icon-btn, .btn, .sync {
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  cursor: pointer;
}

.icon-btn {
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 14px;
  min-height: 44px;
  font-weight: 650;
}

.btn-primary { background: var(--accent-btn); color: var(--accent-btn-ink); border-color: transparent; }
.btn-ghost { background: transparent; }
.btn-danger { background: var(--bad); color: #fff; border-color: transparent; }
.btn-block { width: 100%; }
.btn:disabled, .input:disabled, .select:disabled, .textarea:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.sync {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-radius: 999px;
}

.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sync.is-off .dot { background: var(--warn); }

.main {
  padding: 12px 12px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 20px);
  min-width: 0;
}

.view-inner { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
#view-captura .view-inner { padding-bottom: 76px; }

.view-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: flex-end; }
.view-title { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
.view-sub { margin: 2px 0 0; color: var(--text-dim); font-size: 13px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  min-width: 0;
}

.card-title { margin: 0 0 8px; font-size: 15px; }
.muted { color: var(--text-dim); margin: 0; font-size: 13px; }
.hint { color: var(--text-dim); font-size: 12px; margin: 6px 0 0; }

.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  min-width: 0;
}

.kpi-label {
  margin: 0;
  color: var(--text-dim);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.kpi-value { margin: 6px 0 0; font-size: 1.7rem; font-weight: 750; letter-spacing: -0.03em; line-height: 1.05; }
.kpi-sub { margin: 6px 0 0; color: var(--text-dim); font-size: 12px; }
.kpi-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 28px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  border: 1px solid transparent;
}

.chip .icon { width: 14px; height: 14px; }
.chip-bajo { background: var(--chip-ok-bg); color: var(--ok-ink); }
.chip-medio { background: var(--chip-warn-bg); color: var(--warn-ink); }
.chip-critico { background: var(--chip-bad-bg); color: var(--bad-ink); }
.chip-neutral { background: var(--surface-2); color: var(--text); border-color: var(--border); }
.chip-btn { cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text); }
.chip-btn.is-on { background: var(--surface-2); border-color: var(--accent); color: var(--text); }

.block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0 12px 12px;
}

.block-sum {
  cursor: pointer;
  font-weight: 700;
  padding: 12px 0;
  list-style: none;
}

.block-sum::-webkit-details-marker { display: none; }

.field { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.field span, .label { font-size: 13px; color: var(--text-dim); }

.input, .select, .textarea {
  width: 100%;
  min-height: 44px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  padding: 8px 10px;
}

.textarea { min-height: 88px; resize: vertical; }

.grid-2, .grid-3 { display: grid; gap: 8px; }
.grid-2 { grid-template-columns: 1fr; }

.progress {
  height: 10px;
  background: var(--surface-2);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 10px;
}

.progress > span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent-btn);
  border-radius: inherit;
}

.editor-row, .task, .instr, .alert-item, .flash-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  margin-top: 8px;
  background: var(--bg);
  min-width: 0;
}

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 160px; min-width: 0; }

.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper strong { min-width: 2ch; text-align: center; font-size: 20px; }

.hse-line {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}

.alert {
  margin-top: 8px;
  padding: 10px;
  border-radius: 10px;
  background: var(--chip-bad-bg);
  color: var(--bad-ink);
  border: 1px solid var(--bad);
}

.banner {
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
}

.banner-ok { border-color: var(--ok); background: var(--chip-ok-bg); }
.banner p, .banner strong { margin: 0; }
.banner p { margin-top: 4px; }

.error-box {
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--bad);
  background: var(--chip-bad-bg);
  color: var(--text);
}

.error-title { margin: 0 0 6px; font-weight: 700; color: var(--bad-ink); }
.error-list { margin: 0; padding-left: 18px; }
.is-invalid { border-color: var(--bad) !important; }

.photo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.photo-card, .photo-open {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  color: inherit;
  text-align: left;
  cursor: pointer;
  min-height: 44px;
  overflow: hidden;
}

.photo-card img, .thumb {
  width: 100%;
  height: 96px;
  object-fit: cover;
  display: block;
  background: var(--bg);
}

.photo-card span, .photo-meta { padding: 0 8px 8px; font-size: 12px; }

.upload-track { height: 6px; background: var(--surface); border-radius: 99px; overflow: hidden; margin: 0 8px; }
.upload-track > span { display: block; height: 100%; width: 0; background: var(--accent-2); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filters .select, .filters .input { flex: 1 1 140px; width: auto; }

.chart-box { position: relative; height: 220px; min-width: 0; max-width: 100%; }
.chart-box canvas { display: block; max-width: 100%; }

.ring-wrap { display: flex; align-items: center; gap: 12px; }
.ring { width: 76px; height: 76px; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--border); stroke-width: 3.5; }
.ring-fg { fill: none; stroke: var(--accent-btn); stroke-width: 3.5; stroke-linecap: round; }

.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th, .data-table td {
  text-align: left;
  padding: 8px 6px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.data-table th { color: var(--text-dim); font-weight: 650; font-size: 12px; }
.scroll-x { overflow-x: auto; max-width: 100%; }

.check { display: flex; gap: 8px; align-items: center; min-height: 44px; }
.check input { width: 20px; height: 20px; }

.task { display: grid; gap: 8px; }
.task.is-done { opacity: 0.6; }
.drag-handle { cursor: grab; color: var(--text-dim); min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }

.split, .close-grid { display: grid; gap: 12px; }

.submit-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  z-index: 30;
  padding: 8px 12px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  border-top: 1px solid var(--border);
}

.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--surface);
  border-top: 1px solid var(--border);
}

.tab-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
}

.tab-btn.is-active { color: var(--accent); font-weight: 700; }

.toasts {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 76px);
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--accent-btn);
  border-radius: 12px;
  padding: 12px;
  box-shadow: var(--shadow);
}

.toast strong, .toast p { margin: 0; }
.toast p { margin-top: 4px; color: var(--text-dim); }

.modal-back {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(8, 10, 12, 0.72);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.modal-card {
  width: min(960px, 100%);
  max-height: 100dvh;
  overflow: auto;
  background: var(--surface);
  color: var(--text);
  border-radius: 12px 12px 0 0;
  padding: 12px;
}

.modal-toolbar { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(8, 10, 12, 0.88);
  display: flex;
  flex-direction: column;
  padding: 12px;
}

.lightbox-figure { margin: auto; max-width: 960px; width: 100%; }
.lightbox-figure img { width: 100%; max-height: 62vh; object-fit: contain; background: #0f1419; border-radius: 10px; }
.lightbox-caption { color: #e6e9ec; }
.lightbox-caption p { margin: 4px 0; }

.empty { color: var(--text-dim); margin: 8px 0; }

.pending-banner {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
}

.print-sheet {
  background: #fff;
  color: #15202b;
  border: 1px solid #d5dee6;
  border-radius: 8px;
  padding: 16px;
}

.print-sheet h2, .print-sheet h3 { margin: 0 0 6px; }
.print-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.print-kpi { border: 1px solid #d5dee6; border-radius: 8px; padding: 8px; }
.print-kpi strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.print-photos { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.print-photos img { width: 100%; height: 78px; object-fit: cover; border-radius: 6px; }
.print-note { margin-top: 12px; padding-top: 8px; border-top: 1px solid #d5dee6; }
.saved-count { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: #8a5a00; }

@media (min-width: 768px) {
  .main { padding: 16px 16px calc(var(--tabbar-h) + 24px); }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .kpi-grid { grid-template-columns: repeat(3, 1fr); }
  .kpi-value { font-size: 2rem; }
  .chart-box { height: 280px; }
  .modal-back { align-items: center; padding: 24px; }
  .modal-card { border-radius: 12px; max-height: calc(100dvh - 48px); }
  .toasts { left: auto; right: 16px; width: min(380px, calc(100% - 32px)); }
  .print-kpis { grid-template-columns: repeat(4, 1fr); }
}

@media (min-width: 1024px) {
  .only-mobile { display: none; }
  .app-shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .sidebar { display: flex; position: sticky; top: 0; height: 100vh; }
  .tabbar { display: none; }
  .main { padding: 20px 24px 48px; }
  .submit-bar { left: var(--sidebar-w); bottom: 0; }
  .toasts { bottom: 88px; }
  .photo-grid { grid-template-columns: repeat(4, 1fr); }
  .kpi-grid { grid-template-columns: repeat(4, 1fr); }
  .chart-box { height: 320px; }
  .split, .close-grid { grid-template-columns: 1.2fr 0.8fr; }
  .grid-3 { grid-template-columns: 1.4fr 1fr 1fr; }
}

/* Tour guiado. El comportamiento vive en tour.js. */

[data-tour] { scroll-margin: 112px 16px 132px; }

.tour-launch { position: relative; }

.tour-launch::after {
  content: "Iniciar Tour Guiado";
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 5;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--text);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.3;
  white-space: nowrap;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transform: translateY(-4px);
}

@media (hover: hover) {
  .tour-launch:hover::after,
  .tour-launch:focus-visible::after {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
}

.tour-root[hidden] { display: none !important; }

.tour-blocker {
  position: fixed;
  z-index: 100;
  background: rgba(8, 10, 12, 0.72);
}

.tour-ring {
  position: fixed;
  z-index: 101;
  pointer-events: none;
  border: 2px solid var(--accent-btn);
  border-radius: 12px;
  box-shadow: 0 0 0 0 rgba(245, 165, 36, 0.45);
  animation: tour-pulse 1.6s ease-in-out infinite;
}

@keyframes tour-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(245, 165, 36, 0.45); }
  50% { box-shadow: 0 0 0 10px rgba(245, 165, 36, 0); }
}

body:has(.tour-root.is-ready) .tour-launch::after { display: none; }

.tour-card {
  position: fixed;
  z-index: 102;
  width: min(360px, calc(100vw - 24px));
  overflow: visible;
  padding: 16px 14px 12px;
  border: 1px solid var(--border);
  border-top: 3px solid var(--accent-btn);

/**
 * Estado central. Toda mutación pasa por setState, persiste y avisa a las vistas.
 * Las vistas no escriben localStorage por su cuenta.
 */
let appState = null;
const listeners = new Set();

function getState() {
  return appState;
}

function persistState() {
  try {
    if (typeof localStorage === "undefined") return { ok: true };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    return { ok: true };
  } catch (error) {
    return { ok: false, error };
  }
}

/**
 * @param {Object} patch claves de primer nivel a reemplazar
 * @param {Object} [meta] aviso para las vistas (qué refrescar)
 */
function setState(patch, meta) {
  appState = Object.assign({}, appState, patch);
  const saved = persistState();
  const info = Object.assign({ saved }, meta || {});
  listeners.forEach((fn) => fn(appState, info));
  return appState;
}

function subscribe(fn) {
  listeners.add(fn);
  return function unsubscribe() {
    listeners.delete(fn);
  };
}

function loadState() {
  try {
    if (typeof localStorage === "undefined") return createInitialState();
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return createInitialState();
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.version !== 1 || !parsed.holes || !parsed.baseline) {
      return createInitialState();
    }
    return parsed;
  } catch (error) {
    return createInitialState();
  }
}

function initState() {
  appState = loadState();
  if (typeof document !== "undefined") {
    document.documentElement.dataset.theme = appState.theme || "dark";
  }
  return appState;
}

function resetDemo() {
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem("sparc_tour_completed");
    }
  } catch (error) {
    /* Si el almacenamiento está bloqueado, igual recargamos el mock en memoria. */
  }
  if (typeof location !== "undefined") location.reload();
}

  <script>
/**
 * Cálculos puros de supervisión. No leen ni escriben el DOM.
 * El estado entra siempre como argumento para poder probarlos.
 */

const NF_1 = new Intl.NumberFormat("es-PE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const NF_0 = new Intl.NumberFormat("es-PE", { maximumFractionDigits: 0 });
const HORAS_TURNO = 12;
const HORAS_MANUALES_REF = 3.5;
const MAX_METROS_DIA = 60;

function round1(n) {
  return Math.round((Number(n) + Number.EPSILON) * 10) / 10;
}

function clamp(n, min, max) {
  return Math.min(max, Math.max(min, n));
}

/** Acepta coma o punto decimal. */
function parseNum(value) {
  if (typeof value === "number") return value;
  if (value == null) return NaN;
  const text = String(value).trim().replace(/\s/g, "").replace(",", ".");
  if (text === "" || text === "-" || text === "." || text === "-.") return NaN;
  const n = Number(text);
  return Number.isFinite(n) ? n : NaN;
}

function formatM(n) {
  if (n == null || !Number.isFinite(Number(n))) return "—";
  return NF_1.format(Number(n));
}

function formatM0(n) {
  if (n == null || !Number.isFinite(Number(n))) return "—";
  return NF_0.format(Number(n));
}

function formatPct(n) {
  if (n == null || !Number.isFinite(Number(n))) return "—";
  return NF_1.format(Number(n)) + " %";
}

function formatSignedM(n) {
  if (n == null || !Number.isFinite(Number(n))) return "—";
  const abs = formatM(Math.abs(n));
  if (n > 0) return "+" + abs;
  if (n < 0) return "−" + abs;
  return abs;
}

function formatSignedPct(n) {
  if (n == null || !Number.isFinite(Number(n))) return "—";
  const abs = NF_1.format(Math.abs(n)) + " %";
  if (n > 0) return "+" + abs;
  if (n < 0) return "−" + abs;
  return abs;
}

/** @param {number} min minutos */
function formatDuration(min) {
  if (min == null || !Number.isFinite(Number(min))) return "—";
  const total = Math.max(0, Math.round(Number(min)));
  const h = Math.floor(total / 60);
  const m = total % 60;
  if (h <= 0) return m + " min";
  return h + " h " + m + " min";
}

function uid(prefix) {
  const rnd = Math.random().toString(36).slice(2, 8);
  const tail = Date.now().toString(36).slice(-4);
  return (prefix || "id") + "-" + rnd + tail;
}

function holeById(state, holeId) {
  return (state.holes || []).find((hole) => hole.id === holeId) || null;
}

function closureKey(holeId, date) {
  return holeId + "|" + date;
}

function closureOf(state, holeId, date) {
  return (state.closures && state.closures[closureKey(holeId, date)]) || null;
}

function jornadaEmitida(state, holeId, date) {
  const closure = closureOf(state, holeId, date || DEMO_TODAY);
  return !!(closure && closure.status === "emitido");
}

function parseLocal(iso) {
  if (!iso) return NaN;
  const parts = String(iso).split("T");
  const date = parts[0].split("-").map(Number);
  const time = (parts[1] || "00:00").split(":").map(Number);
  return new Date(date[0], (date[1] || 1) - 1, date[2] || 1, time[0] || 0, time[1] || 0, 0, 0).getTime();
}

function fechaCorta(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.slice(0, 10).split("-");
  const months = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  return Number(d) + " " + months[Number(m) - 1] + " " + y;
}

function horaCorta(iso) {
  if (!iso || iso.indexOf("T") < 0) return "—";
  return iso.slice(11, 16);
}

function addDaysIsoCalc(iso, days) {
  const [y, m, d] = iso.slice(0, 10).split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + days));
  return dt.toISOString().slice(0, 10);
}

/**
 * Minutos entre inicio y fin. Si no hay fin, usa DEMO_NOW (evento abierto).
 * @returns {number}
 */
function duracionMinutos(startIso, endIso, nowIso) {
  const start = parseLocal(startIso);
  const end = parseLocal(endIso || nowIso || DEMO_NOW);
  if (!Number.isFinite(start) || !Number.isFinite(end)) return NaN;
  return (end - start) / 60000;
}

/**
 * Criticidad por duración: bajo < 30, medio 30–120, crítico > 120.
 * @param {number} min
 * @returns {"bajo"|"medio"|"critico"|null}
 */
function criticidadPorMinutos(min) {
  if (!Number.isFinite(min) || min < 0) return null;
  if (min < 30) return "bajo";
  if (min <= 120) return "medio";
  return "critico";
}

function nivelLabel(level) {
  if (level === "bajo") return "Bajo";
  if (level === "medio") return "Medio";
  if (level === "critico") return "Crítico";
  return "—";
}

/**
 * Semáforo de desviación porcentual (ejecutado − programado) / programado.
 * > −5 % bajo, entre −5 % y −15 % medio, < −15 % crítico.
 */
function nivelDesviacion(pct) {
  if (!Number.isFinite(pct)) return "medio";
  if (pct > -5) return "bajo";
  if (pct >= -15) return "medio";
  return "critico";
}

function minutosEvento(ev, nowIso) {
  return duracionMinutos(ev.start, ev.end, nowIso);
}

function criticidadEvento(ev, nowIso) {
  if (ev.criticalityOverride === "bajo" || ev.criticalityOverride === "medio" || ev.criticalityOverride === "critico") {
    return ev.criticalityOverride;
  }
  return criticidadPorMinutos(minutosEvento(ev, nowIso));
}

function nightEfectivo(state, holeId, date) {
  const closure = closureOf(state, holeId, date);
  if (closure && closure.nightLoaded) return round1(Number(closure.nightMeters) || 0);
  return round1((state.flashReports || []).reduce((sum, report) => {
    if (report.holeId === holeId && report.date === date && report.shift === "noche") return sum + Number(report.meters || 0);
    return sum;
  }, 0));
}

/**
 * Metros atribuibles a una fecha: serie base + flash de día + noche efectiva.
 * @param {object} state
 * @param {string} holeId
 * @param {string} date
 * @param {{onlyIncluded?: boolean}} [opts]
 */
function metrosFecha(state, holeId, date, opts) {
  const onlyIncluded = opts && opts.onlyIncluded;
  let total = 0;
  (state.baseline[holeId] || []).forEach((row) => {
    if (row.date === date) total += Number(row.meters) || 0;
  });
  (state.flashReports || []).forEach((report) => {
    if (report.holeId !== holeId || report.date !== date) return;
    if (report.shift === "noche") return;
    if (onlyIncluded && report.included === false) return;
    total += Number(report.meters) || 0;
  });
  if (onlyIncluded) {
    const closure = closureOf(state, holeId, date);
    if (closure && closure.nightLoaded) total += Number(closure.nightMeters) || 0;
    else {
      (state.flashReports || []).forEach((report) => {
        if (report.holeId === holeId && report.date === date && report.shift === "noche" && report.included !== false) {
          total += Number(report.meters) || 0;
        }
      });
    }
  } else {
    total += nightEfectivo(state, holeId, date);
  }
  return round1(total);
}

/**
 * Suma de metros de reportes de esa fecha (serie + flash + noche).
 * @param {object} state
 * @param {string} holeId
 * @param {string} date
 */
function avanceDia(state, holeId, date) {
  return metrosFecha(state, holeId, date, { onlyIncluded: false });
}

function fechasConMetros(state, holeId) {
  const dates = new Set();
  (state.baseline[holeId] || []).forEach((row) => dates.add(row.date));
  (state.flashReports || []).forEach((report) => {
    if (report.holeId === holeId) dates.add(report.date);
  });
  Object.keys(state.closures || {}).forEach((key) => {
    const split = key.split("|");
    if (split[0] === holeId && state.closures[key] && state.closures[key].nightLoaded) dates.add(split[1]);
  });
  return Array.from(dates).sort();
}

/**
 * @param {object} state
 * @param {string} holeId
 * @returns {number}
 */
function acumulado(state, holeId) {
  const total = fechasConMetros(state, holeId).reduce((sum, date) => sum + avanceDia(state, holeId, date), 0);
  return round1(total);
}

/**
 * Porcentaje de la meta, 1 decimal, acotado a 0–100.
 * @returns {number}
 */
function pctMeta(state, holeId) {
  const hole = holeById(state, holeId);
  if (!hole || !hole.targetM) return 0;
  return clamp(round1((acumulado(state, holeId) / hole.targetM) * 100), 0, 100);
}

function metrosRestantes(state, holeId) {
  const hole = holeById(state, holeId);
  if (!hole) return 0;
  return round1(hole.targetM - acumulado(state, holeId));
}

function diasConPerforacion(state, holeId) {
  return fechasConMetros(state, holeId).filter((date) => avanceDia(state, holeId, date) > 0).length;
}

/**
 * Acumulado / días de campaña con perforación.
 * @returns {number|null}
 */
function rendimientoPromedio(state, holeId) {
  const days = diasConPerforacion(state, holeId);
  if (!days) return null;
  return acumulado(state, holeId) / days;
}

/**
 * Días adicionales estimados (redondeo hacia arriba).
 * @returns {number|null}
 */
function diasEstimadosFin(state, holeId) {
  const rest = metrosRestantes(state, holeId);
  if (rest <= 0) return 0;
  const rate = rendimientoPromedio(state, holeId);
  if (!rate || rate <= 0) return null;
  return Math.ceil(rest / rate - 1e-9);
}

/**
 * Fecha proyectada de término a partir de DEMO_TODAY + días estimados.
 * @returns {string|null}
 */
function fechaProyectadaFin(state, holeId) {
  const days = diasEstimadosFin(state, holeId);
  if (days == null) return null;
  return addDaysIsoCalc(DEMO_TODAY, days);
}

function rendimientoUltimos(diarios, n) {
  const last = diarios.filter((value) => Number.isFinite(value)).slice(-n);
  if (!last.length) return 0;
  const sum = last.reduce((acc, value) => acc + value, 0);
  return sum / last.length;
}

/**
 * Curva S: programado, ejecutado y tendencia hasta la meta.
 * La tendencia usa el promedio diario de los últimos 5 días con perforación.
 * @param {"7"|"15"|"todo"} [range]
 */
function curvaS(state, holeId, range) {
  const hole = holeById(state, holeId);
  const empty = {
    dates: [], labels: [], programado: [], ejecutado: [], tendencia: [],
    diario: [], metaDiaria: [], desviacion: [], target: hole ? hole.targetM : 0
  };
  if (!hole) return empty;

  const dates = fechasConMetros(state, holeId);
  if (!dates.length) return empty;
  const start = dates[0];
  const diarios = dates.map((date) => avanceDia(state, holeId, date));
  const rate5 = rendimientoUltimos(diarios, 5);
  const actualCount = dates.length;

  let accExec = 0;
  const ejecutado = [];
  const programado = [];
  const desviacion = [];
  dates.forEach((date, index) => {
    accExec = round1(accExec + diarios[index]);
    const planned = round1(Math.min(hole.targetM, hole.plannedMPerDay * (index + 1)));
    ejecutado.push(accExec);
    programado.push(planned);
    const metros = round1(accExec - planned);
    const pct = planned ? (metros / planned) * 100 : 0;
    desviacion.push({ metros, pct, nivel: nivelDesviacion(pct) });
  });

  const tendencia = ejecutado.map(() => null);
  const futureDates = [];
  const futureProg = [];
  const futureTrend = [];
  const lastExec = ejecutado[ejecutado.length - 1];
  tendencia[tendencia.length - 1] = lastExec;

  let projected = lastExec;
  let guard = 0;
  let trendDay = actualCount;
  if (rate5 > 0 && projected < hole.targetM) {
    while (projected < hole.targetM && guard < 80) {
      trendDay += 1;
      projected = round1(Math.min(hole.targetM, projected + rate5));
      futureDates.push(addDaysIsoCalc(start, trendDay - 1));
      futureProg.push(round1(Math.min(hole.targetM, hole.plannedMPerDay * trendDay)));
      futureTrend.push(projected);
      guard += 1;
      if (projected >= hole.targetM) break;
    }
  }

  let day = actualCount;
  while (day * hole.plannedMPerDay < hole.targetM && day - actualCount < 80) {
    day += 1;
    if (futureDates.length >= day - actualCount) continue;
    futureDates.push(addDaysIsoCalc(start, day - 1));
    futureProg.push(round1(Math.min(hole.targetM, hole.plannedMPerDay * day)));
    futureTrend.push(null);
  }

  const allDates = dates.concat(futureDates);
  const allProg = programado.concat(futureProg);
  const allExec = ejecutado.concat(futureDates.map(() => null));
  const allTrend = tendencia.concat(futureTrend);
  const allDiario = diarios.concat(futureDates.map(() => null));
  const allMeta = allDates.map(() => hole.plannedMPerDay);
  const allDesv = desviacion.concat(futureDates.map(() => null));

  let from = 0;
  let to = actualCount;
  if (range === "7") from = Math.max(0, actualCount - 7);
  else if (range === "15") from = Math.max(0, actualCount - 15);
  else to = allDates.length;

  const slice = (arr) => arr.slice(from, to);
  return {
    dates: slice(allDates),
    labels: slice(allDates).map((date) => date.slice(8, 10) + "/" + date.slice(5, 7)),
    programado: slice(allProg),
    ejecutado: slice(allExec),
    tendencia: slice(allTrend),
    diario: slice(allDiario),
    metaDiaria: slice(allMeta),
    desviacion: slice(allDesv),
    target: hole.targetM,
    fullDates: allDates
  };
}

function desviacionActual(state, holeId) {
  const curve = curvaS(state, holeId, "todo");
  let last = null;
  curve.desviacion.forEach((item) => {
    if (item) last = item;
  });
  if (!last) return { metros: 0, pct: 0, nivel: "bajo", programado: 0, ejecutado: acumulado(state, holeId) };
  const ejecutado = acumulado(state, holeId);
  return {
    metros: last.metros,
    pct: last.pct,
    nivel: last.nivel,
    programado: round1(ejecutado - last.metros),
    ejecutado
  };
}

function estadoGlobal(state, holeId) {
  return desviacionActual(state, holeId).nivel;
}

function eventosDe(state, holeId, date, shift) {
  return (state.downtimes || []).filter((ev) => {
    if (holeId && ev.holeId !== holeId) return false;
    if (date && String(ev.start || "").slice(0, 10) !== date) return false;
    if (shift && ev.shift !== shift) return false;
    return true;
  });
}

function tiempoMuertoMin(events, nowIso) {
  return events.reduce((sum, ev) => {
    const min = minutosEvento(ev, nowIso);
    return sum + (Number.isFinite(min) && min > 0 ? min : 0);
  }, 0);
}

/** Horas de tiempo muerto del día, 1 decimal, y minutos crudos. */
function tiempoMuertoDia(state, holeId, date) {
  const events = eventosDe(state, holeId, date);
  const minutes = tiempoMuertoMin(events);
  return { minutes, hours: round1(minutes / 60), events };
}

function tiempoMuertoTurno(state, holeId, date, shift) {
  const events = eventosDe(state, holeId, date, shift);
  const minutes = tiempoMuertoMin(events);
  return {
    minutes,
    hours: round1(minutes / 60),
    pctTurno: round1((minutes / (HORAS_TURNO * 60)) * 100),
    events
  };
}

function contarPorCriticidad(events, nowIso) {
  const counts = { bajo: 0, medio: 0, critico: 0 };
  const minutes = { bajo: 0, medio: 0, critico: 0 };
  events.forEach((ev) => {
    const level = criticidadEvento(ev, nowIso);
    if (!level) return;
    counts[level] += 1;
    const min = minutosEvento(ev, nowIso);
    if (Number.isFinite(min) && min > 0) minutes[level] += min;
  });
  return { counts, minutes };
}

function minutosPorCausa(events, nowIso) {
  const map = new Map();
  events.forEach((ev) => {
    const min = minutosEvento(ev, nowIso);
    if (!Number.isFinite(min) || min <= 0) return;
    map.set(ev.cause, (map.get(ev.cause) || 0) + min);
  });
  return Array.from(map.entries()).map(([cause, minutes]) => ({ cause, minutes: round1(minutes) }))
    .sort((a, b) => b.minutes - a.minutes);
}

function sugerirRevisionEnsayo(test) {
  const result = Number(test.result);
  if (!Number.isFinite(result)) return false;
  if (test.type === "Lugeon" && result > 15) return true;
  if (test.type === "SPT" && result < 10) return true;
  return false;
}

function hseDeSondaje(state, holeId) {
  const observations = (state.hseObservations || []).filter((item) => item.holeId === holeId);
  const incidents = (state.hseIncidents || []).filter((item) => item.holeId === holeId);
  const accidents = (state.hseAccidents || []).filter((item) => item.holeId === holeId);
  return {
    observations,
    incidents,
    accidents,
    daysWithoutAccidents: accidents.length > 0 ? 0 : state.daysWithoutAccidents
  };
}

function pendientesEmpalme(state) {
  return (state.tasks || []).filter((task) => !task.done).length;
}

function fotosFiltradas(state) {
  const filters = (state.ui && state.ui.photoFilters) || {};
  const hole = filters.holeId === "todos" ? null : (filters.holeId || state.activeHoleId);
  return (state.photos || []).filter((photo) => {
    if (hole && photo.holeId !== hole) return false;
    if (filters.category && photo.category !== filters.category) return false;
    if (filters.shift && photo.shift !== filters.shift) return false;
    const day = String(photo.takenAt || "").slice(0, 10);
    if (filters.from && day < filters.from) return false;
    if (filters.to && day > filters.to) return false;
    return true;
  });
}

function kpisSondaje(state, holeId, date) {
  const hole = holeById(state, holeId);
  const desv = desviacionActual(state, holeId);
  const rend = rendimientoPromedio(state, holeId);
  const muerto = tiempoMuertoDia(state, holeId, date || DEMO_TODAY);
  return {
    hole,
    dia: avanceDia(state, holeId, date || DEMO_TODAY),
    acumulado: acumulado(state, holeId),
    pct: pctMeta(state, holeId),
    restantes: metrosRestantes(state, holeId),
    rendimiento: rend == null ? null : round1(rend),
    dias: diasEstimadosFin(state, holeId),
    fechaFin: fechaProyectadaFin(state, holeId),
    desviacion: desv,
    nivel: desv.nivel,
    muertoHoras: muerto.hours,
    muertoMin: muerto.minutes,
    pendientes: pendientesEmpalme(state)
  };
}

function serieBaseHoy(state, holeId, date) {
  return round1((state.baseline[holeId] || []).reduce((sum, row) => {
    return row.date === date ? sum + Number(row.meters || 0) : sum;
  }, 0));
}

function flashMetros(state, holeId, date, shift, onlyIncluded) {
  return round1((state.flashReports || []).reduce((sum, report) => {
    if (report.holeId !== holeId || report.date !== date || report.shift !== shift) return sum;
    if (onlyIncluded && report.included === false) return sum;
    return sum + Number(report.meters || 0);
  }, 0));
}

/**
 * Validación del Flash Report. No guarda nada.
 * @returns {{ok: boolean, messages: string[], meters: number}}
 */
function validarFlash(draft, state) {
  const messages = [];
  const from = parseNum(draft.fromM);
  const to = parseNum(draft.toM);
  let meters = NaN;

  if (!draft.author || !String(draft.author).trim()) messages.push("Indica el autor del Flash Report.");
  if (draft.fromM === "" || draft.toM === "" || !Number.isFinite(from) || !Number.isFinite(to)) {
    messages.push("Indica la profundidad inicial y final del turno.");
  } else if (to < from) {
    messages.push("La profundidad final debe ser mayor o igual que la inicial.");
  } else {
    meters = round1(to - from);
    if (meters <= 0) messages.push("El tramo perforado debe ser mayor que 0 m.");
    if (meters > MAX_METROS_DIA) messages.push("Los metros del día no pueden superar 60 m.");
    const hole = holeById(state, draft.holeId);
    const acc = acumulado(state, draft.holeId);
    if (hole && acc + meters > hole.targetM + 1e-9) {
      const max = round1(Math.max(0, hole.targetM - acc));
      messages.push("El acumulado no puede superar la meta (" + formatM(hole.targetM) + " m). Máximo adicional: " + formatM(max) + " m.");
    }
  }

  (draft.tests || []).forEach((test, index) => {
    const label = "Ensayo " + (index + 1);
    const a = parseNum(test.fromM);
    const b = parseNum(test.toM);
    const result = parseNum(test.result);
    if (!Number.isFinite(a) || !Number.isFinite(b)) messages.push(label + ": indica profundidad desde y hasta.");
    else if (b < a) messages.push(label + ": la profundidad hasta debe ser mayor o igual que desde.");
    if (!Number.isFinite(result)) messages.push(label + ": el resultado debe ser numérico.");
    if (!test.type) messages.push(label + ": elige el tipo de ensayo.");
    if (!test.status) messages.push(label + ": elige el estado del ensayo.");
  });

  (draft.downtimes || []).forEach((ev, index) => {
    const label = "Tiempo muerto " + (index + 1);
    if (!ev.start || !ev.end) messages.push(label + ": indica inicio y fin.");
    else if (parseLocal(ev.end) < parseLocal(ev.start)) messages.push(label + ": la hora de fin debe ser posterior o igual al inicio.");
    const cause = ev.cause === "Otro" ? String(ev.causeOther || "").trim() : ev.cause;
    if (!cause) messages.push(label + ": indica la causa.");
    if (!ev.responsible) messages.push(label + ": indica el responsable.");
  });

  const accidents = Number(draft.hse && draft.hse.accidents) || 0;
  if (accidents > 0 && !String(draft.hse.accidentNote || "").trim()) {
    messages.push("Si hay accidentes, la descripción es obligatoria.");
  }
  if (String(draft.comments || "").length > 280) messages.push("Los comentarios superan 280 caracteres.");

  (draft.photos || []).forEach((photo, index) => {
    if (!photo.category) messages.push("Foto " + (index + 1) + ": elige una categoría.");
    if (!String(photo.label || "").trim()) messages.push("Foto " + (index + 1) + ": escribe un rótulo.");
  });

  return { ok: messages.length === 0, messages, meters };
}

function validarCierre(state, holeId, date, issuer) {
  const messages = [];
  const closure = closureOf(state, holeId, date);
  if (!closure || !closure.nightLoaded || !Number.isFinite(Number(closure.nightMeters))) {
    messages.push("Metros de turno noche: carga el valor (0 es válido si no hubo avance).");
  } else {
    const night = Number(closure.nightMeters);
    if (night < 0) messages.push("Metros de turno noche: no puede ser negativo.");
    if (night > MAX_METROS_DIA) messages.push("Metros de turno noche: no pueden superar 60 m.");
    const hole = holeById(state, holeId);
    const withoutNight = round1(acumulado(state, holeId) - nightEfectivo(state, holeId, date));
    if (hole && withoutNight + night > hole.targetM + 1e-9) {
      messages.push("Metros de turno noche: el acumulado superaría la meta de " + formatM(hole.targetM) + " m.");
    }
  }
  if (!String(issuer || "").trim()) messages.push("Supervisor que emite: indica el nombre.");
  const hse = hseDeSondaje(state, holeId);
  const accidentWithoutNote = hse.accidents.some((item) => !String(item.text || "").trim());
  if (accidentWithoutNote) messages.push("Hay un accidente sin descripción.");
  return { ok: messages.length === 0, messages };
}

/**
 * Minutos ahorrados frente a 3,5 h de armado manual.
 * @param {number} minutosEnApp
 */
function tiempoAhorradoMin(minutosEnApp) {
  const used = Number.isFinite(minutosEnApp) ? Math.max(0, minutosEnApp) : 0;
  return Math.max(0, HORAS_MANUALES_REF * 60 - used);
}

/**
 * Conversión aproximada WGS84 → UTM. Sirve para el botón de GPS real.
 * @returns {{e:number,n:number,zone:string}}
 */
function latLonToUtm(latDeg, lonDeg) {
  const a = 6378137;
  const f = 1 / 298.257223563;
  const k0 = 0.9996;
  const e2 = f * (2 - f);
  const ep2 = e2 / (1 - e2);
  const zoneNum = Math.floor((lonDeg + 180) / 6) + 1;
  const lon0 = ((zoneNum - 1) * 6 - 180 + 3) * Math.PI / 180;
  const lat = latDeg * Math.PI / 180;
  const lon = lonDeg * Math.PI / 180;
  const sinLat = Math.sin(lat);
  const cosLat = Math.cos(lat);
  const tanLat = Math.tan(lat);
  const N = a / Math.sqrt(1 - e2 * sinLat * sinLat);
  const T = tanLat * tanLat;
  const C = ep2 * cosLat * cosLat;
  const A = (lon - lon0) * cosLat;
  const e4 = e2 * e2;
  const e6 = e4 * e2;
  const M = a * (
    (1 - e2 / 4 - 3 * e4 / 64 - 5 * e6 / 256) * lat
    - (3 * e2 / 8 + 3 * e4 / 32 + 45 * e6 / 1024) * Math.sin(2 * lat)
    + (15 * e4 / 256 + 45 * e6 / 1024) * Math.sin(4 * lat)
    - (35 * e6 / 3072) * Math.sin(6 * lat)
  );
  const east = k0 * N * (A + (1 - T + C) * Math.pow(A, 3) / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(A, 5) / 120) + 500000;
  let north = k0 * (M + N * tanLat * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * Math.pow(A, 4) / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(A, 6) / 720));
  if (latDeg < 0) north += 10000000;
  return {
    e: Math.round(east),
    n: Math.round(north),
    zone: zoneNum + (latDeg >= 0 ? "N" : "S")
  };
}

function csvCell(value) {
  const text = value == null ? "" : String(value);
  if (/[";\n\r]/.test(text)) return "\"" + text.replace(/"/g, "\"\"") + "\"";
  return text;
}

function buildResumenCsv(state, holeId) {
  const kpi = kpisSondaje(state, holeId, DEMO_TODAY);

    ["Fecha proyectada", kpi.fechaFin || ""],

  ];
  const header = lines.map((row) => row.map(csvCell).join(";")).join("\n");
  const seriesHead = ["Fecha", "Programado (m)", "Ejecutado (m)", "Tendencia (m)", "Diario (m)"].join(";");
  const series = curve.dates.map((date, index) => [

    curve.diario[index] == null ? "" : curve.diario[index]
  ].map(csvCell).join(";")).join("\n");
  return "\uFEFF" + header + "\n\n" + seriesHead + "\n" + series + "\n";
}

  id: "metaLine",
  afterDraw(chart, _args, opts) {
    if (!opts || opts.value == null || !chart.scales || !chart.scales.y) return;
    const area = chart.chartArea;
    if (!area) return;
    const y = chart.scales.y.getPixelForValue(opts.value);
    if (y < area.top || y > area.bottom) return;
    const ctx = chart.ctx;
    ctx.save();
    ctx.beginPath();
    ctx.strokeStyle = opts.color || "#e5484d";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.moveTo(area.left, y);
    ctx.lineTo(area.right, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = opts.color || "#e5484d";
    ctx.font = "11px system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("Meta " + opts.value + " m", area.right - 4, Math.max(area.top + 12, y - 6));
    ctx.restore();

      else if (key === "disabled") node.disabled = true;
      else if (key === "selected") node.selected = true;
      else if (key === "open") node.open = true;
      else if (key === "hidden") node.hidden = true;
      else node.setAttribute(key, val === true ? "" : String(val));
    });
  }
  const list = children == null || children === false ? [] : (Array.isArray(children) ? children : [children]);
  list.forEach((child) => {
    if (child == null || child === false) return;
    if (typeof child === "string" || typeof child === "number") node.append(document.createTextNode(String(child)));
    else node.append(child);
  });
  return node;
}

function icon(name) {
  const paths = {
    check: ["M5 12.5 9.5 17 19 7.5"],
    alert: ["M12 4 21.5 20H2.5Z", "M12 9.5v5", "M12 17h.01"],
    plus: ["M12 5v14", "M5 12h14"],
    minus: ["M5 12h14"],
    trash: ["M5 7h14", "M9 7V5h6v2", "M8 7l1 13h6l1-13"],
    up: ["M6 14l6-6 6 6"],
    down: ["M6 10l6 6 6-6"],
    camera: ["M4 8h3l2-2h6l2 2h3v11H4Z", "M12 11.2a2.6 2.6 0 1 0 .01 0"]
  };
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  svg.classList.add("icon");
  (paths[name] || paths.check).forEach((d) => {
    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "currentColor");
    path.setAttribute("stroke-width", "1.8");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    svg.append(path);
  });
  return svg;
}

function selectBox(attrs, values, current) {

  });
  sel.value = current == null ? "" : String(current);

}

function ringNode(pct) {
  const svg = document.createElementNS(SVG_NS, "svg");

  svg.setAttribute("class", "ring");

  [["ring-bg", null], ["ring-fg", pct]].forEach((part) => {
    const circle = document.createElementNS(SVG_NS, "circle");
    circle.setAttribute("cx", "18");
    circle.setAttribute("cy", "18");
    circle.setAttribute("r", "15.5");
    circle.setAttribute("class", part[0]);
    if (part[1] != null) {

      circle.setAttribute("pathLength", "100");
      circle.setAttribute("stroke-dasharray", clamped + " 100");
    }
    svg.append(circle);
  });
  return svg;
}

function trapFocus(container) {
  function onKey(event) {
    if (event.key !== "Tab") return;
    const nodes = Array.from(container.querySelectorAll("button, [href], input, select, textarea"))
      .filter((node) => !node.disabled && !node.hidden);
    if (!nodes.length) return;
    const first = nodes[0];
    const last = nodes[nodes.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }
  container.addEventListener("keydown", onKey);
  return function release() { container.removeEventListener("keydown", onKey); };
}

function paintCapturaCalcs(state, draft) {
  const out = document.getElementById("metros-vivo");
  if (!out || !draft) return;
  const from = parseNum(draft.fromM);
  const to = parseNum(draft.toM);
  const hole = holeById(state, draft.holeId);
  const acc = acumulado(state, draft.holeId);
  let meters = null;
  if (Number.isFinite(from) && Number.isFinite(to) && to >= from) meters = round1(to - from);
  out.textContent = meters == null ? "—" : formatM(meters) + " m";
  const projected = round1(acc + (meters || 0));
  const pct = hole && hole.targetM ? clamp((projected / hole.targetM) * 100, 0, 100) : 0;
  const bar = document.getElementById("avance-bar");
  if (bar) bar.style.width = pct + "%";
  const prog = document.getElementById("avance-progress");
  if (prog) {
    prog.setAttribute("aria-valuenow", String(Math.round(pct)));
    prog.setAttribute("aria-valuetext", formatPct(round1(pct)));
  }
  const hint = document.getElementById("avance-hint");
  if (hint) {
    const bits = ["Acumulado actual " + formatM(acc) + " m"];
    if (hole) bits.push("meta " + formatM0(hole.targetM) + " m");
    if (meters != null) bits.push("con este turno quedaría en " + formatM(projected) + " m (" + formatPct(round1(pct)) + ")");
    hint.textContent = bits.join(" · ");
  }
  const warn = document.getElementById("avance-warn");
  if (warn) {
    const messages = [];
    if (draft.fromM !== "" && draft.toM !== "" && Number.isFinite(from) && Number.isFinite(to) && to < from) {
      messages.push("La profundidad final debe ser mayor o igual que la inicial.");
    }
    if (meters != null && meters > 60) messages.push("Los metros del día no pueden superar 60 m.");
    if (meters != null && meters <= 0) messages.push("El tramo perforado debe ser mayor que 0 m.");
    if (meters != null && hole && acc + meters > hole.targetM + 1e-9) {
      messages.push("El acumulado no puede superar la meta (" + formatM0(hole.targetM) + " m).");
    }
    warn.hidden = messages.length === 0;
    warn.textContent = messages.join(" ");
  }
  const fromInput = document.getElementById("from-m");
  const toInput = document.getElementById("to-m");
  const invalid = warn && !warn.hidden;
  if (fromInput) fromInput.classList.toggle("is-invalid", !!invalid);
  if (toInput) toInput.classList.toggle("is-invalid", !!invalid);
  if (fromInput) fromInput.setAttribute("aria-invalid", invalid ? "true" : "false");
  if (toInput) toInput.setAttribute("aria-invalid", invalid ? "true" : "false");
  const count = document.getElementById("comment-count");
  if (count) count.textContent = String((draft.comments || "").length) + "/280";
  document.querySelectorAll("#down-list .editor-row").forEach((row) => {
    const item = draft.downtimes[Number(row.dataset.index)];
    const slot = row.querySelector(".crit-slot");
    if (!item || !slot) return;
    slot.replaceChildren();
    if (!item.start || !item.end || !(parseLocal(item.end) >= parseLocal(item.start))) {
      slot.append(chipText("Sin duración", "neutral"));
      return;
    }
    const minutes = duracionMinutos(item.start, item.end);
    const level = item.criticalityOverride || criticidadPorMinutos(minutes);
    slot.append(chipLevel(level));
    slot.append(h("span", { class: "hint", text: formatDuration(minutes) + (item.criticalityOverride ? " · manual" : " · auto") }));
  });
}

function cierrePack(state) {
  const holeId = state.activeHoleId;
  const serie = serieBaseHoy(state, holeId, DEMO_TODAY);
  const flashDia = flashMetros(state, holeId, DEMO_TODAY, "dia", false);
  const closure = closureOf(state, holeId, DEMO_TODAY);
  const nightKnown = !!(closure && closure.nightLoaded);
  const night = nightKnown ? Number(closure.nightMeters) : 0;
  return {
    holeId: holeId,
    serie: serie,
    flashDia: flashDia,
    night: night,
    nightKnown: nightKnown,
    kpi: kpisSondaje(state, holeId, DEMO_TODAY),
    muerto: tiempoMuertoDia(state, holeId, DEMO_TODAY),
    turno: tiempoMuertoTurno(state, holeId, DEMO_TODAY, "dia"),
    turnoNoche: tiempoMuertoTurno(state, holeId, DEMO_TODAY, "noche"),
    closure: closure,
    locked: jornadaEmitida(state, holeId, DEMO_TODAY)
  };
}

function trimFuture(curve) {
  let end = curve.diario.length;
  while (end > 0 && curve.diario[end - 1] == null) end -= 1;
  const slice = (arr) => (arr || []).slice(0, end);
  return {
    dates: slice(curve.dates),
    labels: slice(curve.labels),
    programado: slice(curve.programado),
    ejecutado: slice(curve.ejecutado),
    tendencia: slice(curve.tendencia),
    diario: slice(curve.diario),
    metaDiaria: slice(curve.metaDiaria),
    desviacion: slice(curve.desviacion),
    target: curve.target
  };
}

function fotosReporte(state, holeId) {
  const all = (state.photos || []).filter((photo) => photo.holeId === holeId);
  const today = all.filter((photo) => String(photo.takenAt).slice(0, 10) === DEMO_TODAY);
  const rest = all.filter((photo) => String(photo.takenAt).slice(0, 10) !== DEMO_TODAY);
  return today.concat(rest).slice(0, 6);
}

function animateSaved(node) {
  const used = typeof minutosEnApp === "function" ? minutosEnApp() : 0;
  const target = tiempoAhorradoMin(used);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) {
    node.textContent = "~" + formatDuration(target);
    return;
  }
  const start = performance.now();
  function frame(now) {
    const p = Math.min(1, (now - start) / 1100);
    const eased = 1 - Math.pow(1 - p, 3);
    node.textContent = "~" + formatDuration(target * eased);
    if (p < 1) window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);
}

function lightboxOpen() {
  const root = document.getElementById("lightbox");
  return !!(root && !root.hidden);
}

let composer = { text: "", priority: "Media", holeId: "", targetDepth: "", role: "Contratista", instr: "" };
let busy = false;
let quotaWarned = false;
let dragId = "";

function debounce(fn, ms) {
  let timer = 0;
  return function debounced() {
    const args = arguments;
    window.clearTimeout(timer);
    timer = window.setTimeout(() => fn.apply(null, args), ms);
  };
}

function ensureSessionClock() {
  try {
    if (!sessionStorage.getItem("sparc_geo_session_start")) {
      sessionStorage.setItem("sparc_geo_session_start", String(Date.now()));
    }
  } catch (error) { /* sesión en memoria */ }
}

function minutosEnApp() {
  try {
    const start = Number(sessionStorage.getItem("sparc_geo_session_start") || Date.now());
    return Math.max(0, (Date.now() - start) / 60000);
  } catch (error) {
    return 0;
  }
}

function stampNow() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  return DEMO_TODAY + "T" + hh + ":" + mm;
}

function draftStorageKey(holeId, shift) {
  return holeId + ":" + shift + ":" + DEMO_TODAY;
}

function mockUtm(seed) {
  let n = 0;
  String(seed || "x").split("").forEach((ch) => { n = (n + ch.charCodeAt(0) * 3) % 90; });
  return { e: 321450 + n, n: 8687320 + (n % 40), zone: "19S" };
}

function ensureWorkingDraft(state) {
  const key = draftStorageKey(state.activeHoleId, state.activeShift);
  if (workingDraft && draftStorageKey(workingDraft.holeId, workingDraft.shift) === key) return workingDraft;
  const saved = state.drafts && state.drafts[key];
  workingDraft = saved ? JSON.parse(JSON.stringify(saved)) : emptyDraft(state.activeHoleId, state.activeShift);
  if (!workingDraft.hse) workingDraft.hse = { observations: 0, incidents: 0, accidents: 0, accidentNote: "" };
  if (workingDraft.pristine) workingDraft.fromM = String(acumulado(state, workingDraft.holeId));
  return workingDraft;
}

function draftsWithWorking() {
  const drafts = Object.assign({}, getState().drafts || {});
  if (workingDraft) drafts[draftStorageKey(workingDraft.holeId, workingDraft.shift)] = workingDraft;
  return drafts;
}

function stashAnd(patch, refresh) {
  const drafts = draftsWithWorking();
  const closures = readCierreClosures();
  workingDraft = null;
  setState(Object.assign({ drafts: drafts, closures: closures }, patch), { refresh: refresh });
}

const saveDraftSoon = debounce(() => {
  if (!workingDraft) return;
  const drafts = Object.assign({}, getState().drafts || {});
  drafts[draftStorageKey(workingDraft.holeId, workingDraft.shift)] = workingDraft;
  setState({ drafts: drafts }, { kind: "draft", refresh: [] });
}, 150);

const calcSoon = debounce(() => {
  if (workingDraft) paintCapturaCalcs(getState(), workingDraft);
}, 150);

const cierreSoon = debounce(() => {
  const closures = readCierreClosures();
  setState({ closures: closures }, { kind: "cierre-field", refresh: [] });
  paintCierreFigures(getState());
}, 150);

const handoverSoon = debounce(() => {
  setState({ handoverDraftName: readHandoverName() }, { refresh: [] });
}, 150);

function readHandoverName() {
  const input = document.getElementById("handover-name");
  if (input) return input.value;
  return getState().handoverDraftName || "";
}

function readCierreClosures() {
  const state = getState();
  const holeId = state.activeHoleId;
  const key = closureKey(holeId, DEMO_TODAY);
  const prev = state.closures[key] || { status: "borrador", nightLoaded: false, nightMeters: null, issuer: "", issuedAt: null };
  if (prev.status === "emitido") return state.closures;
  const nightEl = document.getElementById("night-meters");
  const issuerEl = document.getElementById("issuer-name");
  if (!nightEl && !issuerEl) return state.closures;
  const text = nightEl ? nightEl.value.trim() : "";
  const meters = parseNum(text);
  const loaded = text !== "" && Number.isFinite(meters);
  const closures = Object.assign({}, state.closures);
  closures[key] = Object.assign({}, prev, {
    nightLoaded: loaded,
    nightMeters: loaded ? meters : null,
    issuer: issuerEl ? issuerEl.value.trim() : (prev.issuer || "")
  });
  return closures;
}

function applyDraftField(target) {
  if (!workingDraft) return;
  const testRow = target.closest("#tests-list .editor-row");
  if (testRow) {
    const item = workingDraft.tests[Number(testRow.dataset.index)];
    if (item && target.dataset.field) item[target.dataset.field] = target.value;
    return;
  }
  const downRow = target.closest("#down-list .editor-row");
  if (downRow) {
    const item = workingDraft.downtimes[Number(downRow.dataset.index)];
    if (item && target.dataset.field) item[target.dataset.field] = target.value;
    if (target.dataset.field === "cause") {
      const other = downRow.querySelector("[data-field='causeOther']");
      if (other) other.hidden = target.value !== "Otro";
    }
    return;
  }
  const photoRow = target.closest("#photos-list .editor-row");
  if (photoRow) {
    const item = workingDraft.photos[Number(photoRow.dataset.index)];
    if (item && target.dataset.field) item[target.dataset.field] = target.value;
    return;
  }
  if (target.id === "author-input") workingDraft.author = target.value;
  if (target.id === "from-m") workingDraft.fromM = target.value;
  if (target.id === "to-m") workingDraft.toM = target.value;
  if (target.id === "comments") workingDraft.comments = target.value;

}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function onLoad() {
      const max = 960;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#1a2129";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      try { resolve(canvas.toDataURL("image/jpeg", 0.72)); }
      catch (error) { reject(error); }
    };
    img.onerror = function onError() {
      URL.revokeObjectURL(url);
      reject(new Error("imagen"));
    };
    img.src = url;
  });
}

async function onPhotos(fileList) {
  if (lockedDraft() || !workingDraft) return;
  const files = Array.from(fileList || []).filter((file) => file.type.indexOf("image/") === 0).slice(0, 8);
  if (!files.length) {
    showToast("Sin imágenes", "Elige archivos de imagen.");
    return;
  }
  for (let i = 0; i < files.length; i += 1) {
    const file = files[i];
    let src = "";
    try {
      src = await compressImage(file);
    } catch (error) {
      src = thumbSvg(file.name || "Foto de campo", "Plataforma");
    }
    const utm = mockUtm(file.name + ":" + Date.now() + ":" + i);
    workingDraft.photos.push({
      id: uid("p"),
      category: "Testigos",
      label: "",
      depth: workingDraft.toM || String(acumulado(getState(), workingDraft.holeId)),
      takenAt: stampNow(),
      utmE: utm.e,
      utmN: utm.n,
      utmZone: utm.zone,
      gpsSource: "mock",
      sync: "Borrador",
      src: src
    });
  }
  workingDraft.pristine = false;
  fillPhotos(workingDraft, false);
  saveDraftSoon();
}

function useGps() {
  if (!workingDraft || !workingDraft.photos.length) {
    showToast("No hay fotos en el flash", "Adjunta una foto y vuelve a intentar.");
    return;
  }
  const apply = (utm, source) => {
    workingDraft.photos.forEach((photo) => {
      photo.utmE = utm.e;
      photo.utmN = utm.n;
      photo.utmZone = utm.zone;
      photo.gpsSource = source;
    });
    fillPhotos(workingDraft, lockedDraft());
    saveDraftSoon();
    showToast(
      source === "gps" ? "Coordenadas GPS aplicadas" : "GPS no disponible",
      source === "gps" ? "Se usó la posición del dispositivo, convertida a UTM." : "Se mantienen las coordenadas UTM mock de la zona 19S."
    );
  };
  if (!navigator.geolocation) {
    apply(mockUtm("fallback"), "mock");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => apply(latLonToUtm(pos.coords.latitude, pos.coords.longitude), "gps"),
    () => apply(mockUtm("fallback"), "mock"),
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
  );
}

function animateBar(bar) {
  return new Promise((resolve) => {
    if (!bar) { resolve(); return; }
    const start = performance.now();
    function frame(now) {
      const p = Math.min(1, (now - start) / 420);
      bar.style.width = Math.round(p * 100) + "%";
      if (p < 1) window.requestAnimationFrame(frame);
      else resolve();
    }
    window.requestAnimationFrame(frame);
  });
}

async function simulateUpload(photos) {
  const offline = getState().offline;
  for (let i = 0; i < photos.length; i += 1) {
    const photo = photos[i];
    const chip = document.querySelector('[data-photo-status="' + photo.id + '"]');
    const bar = document.querySelector('[data-photo-bar="' + photo.id + '"]');
    if (offline) {
      photo.sync = "Pendiente de sincronizar";
      if (chip) chip.textContent = photo.sync;
      continue;
    }
    if (chip) chip.textContent = "Subiendo";
    await animateBar(bar);
    photo.sync = "Subida";
    if (chip) chip.textContent = "Subida";
  }
}

function materializeFlash(draft, meters) {
  const tests = (draft.tests || []).map((test) => ({
    id: uid("t"),
    holeId: draft.holeId,
    date: DEMO_TODAY,
    shift: draft.shift,
    type: test.type,
    fromM: parseNum(test.fromM),
    toM: parseNum(test.toM),
    result: parseNum(test.result),
    unit: test.type === "SPT" ? "N" : (test.type === "Lugeon" ? "UL" : (test.unit || "")),
    status: test.status
  }));
  const downtimes = (draft.downtimes || []).map((ev) => ({
    id: uid("d"),
    holeId: draft.holeId,
    shift: draft.shift,
    start: ev.start,
    end: ev.end,
    cause: ev.cause === "Otro" ? String(ev.causeOther || "").trim() : ev.cause,
    responsible: ev.responsible,
    criticalityOverride: ev.criticalityOverride || null
  }));
  const photos = (draft.photos || []).map((photo) => ({
    id: photo.id || uid("p"),
    holeId: draft.holeId,
    category: photo.category,
    label: String(photo.label || "").trim(),
    depth: photo.depth || "",
    takenAt: photo.takenAt,
    shift: draft.shift,
    author: String(draft.author || "").trim(),
    utmE: photo.utmE,
    utmN: photo.utmN,
    utmZone: photo.utmZone || "19S",
    gpsSource: photo.gpsSource || "mock",
    sync: photo.sync || "Subida",
    src: photo.src
  }));
  const report = {
    id: uid("f"),
    holeId: draft.holeId,
    date: DEMO_TODAY,
    shift: draft.shift,
    author: String(draft.author || "").trim(),
    fromM: parseNum(draft.fromM),
    toM: parseNum(draft.toM),
    meters: meters,
    comments: String(draft.comments || "").trim().slice(0, 280),
    included: true,
    createdAt: stampNow(),
    testIds: tests.map((test) => test.id),
    downtimeIds: downtimes.map((ev) => ev.id),
    photoIds: photos.map((photo) => photo.id),
    hse: {
      observations: Number(draft.hse.observations) || 0,
      incidents: Number(draft.hse.incidents) || 0,
      accidents: Number(draft.hse.accidents) || 0,
      accidentNote: String((draft.hse && draft.hse.accidentNote) || "").trim()
    }
  };
  return { report: report, tests: tests, downtimes: downtimes, photos: photos };
}

function hseFromReport(draft, report) {
  const observations = [];
  const incidents = [];
  const accidents = [];
  for (let i = 0; i < report.hse.observations; i += 1) {
    observations.push({ id: uid("o"), holeId: draft.holeId, date: DEMO_TODAY, shift: draft.shift, text: "Observación registrada en Flash Report", status: "Pendiente" });
  }
  for (let i = 0; i < report.hse.incidents; i += 1) {
    incidents.push({ id: uid("i"), holeId: draft.holeId, date: DEMO_TODAY, shift: draft.shift, text: "Incidente sin lesión registrado en Flash Report", status: "Pendiente", lostTime: false });
  }
  for (let i = 0; i < report.hse.accidents; i += 1) {
    accidents.push({
      id: uid("a"),
      holeId: draft.holeId,
      date: DEMO_TODAY,
      shift: draft.shift,
      text: report.hse.accidentNote || "Accidente registrado en Flash Report",
      status: "Abierto",
      lostTime: true
    });
  }
  return { observations: observations, incidents: incidents, accidents: accidents };
}

async function submitFlash() {
  if (busy || !workingDraft) return;
  const state = getState();
  const draft = workingDraft;
  if (jornadaEmitida(state, draft.holeId, DEMO_TODAY)) {
    showMessages("form-errors", ["La jornada de este sondaje ya fue emitida."]);
    return;
  }
  const result = validarFlash(draft, state);
  showMessages("form-errors", result.messages);
  if (!result.ok) return;
  busy = true;
  const button = document.getElementById("submit-flash");
  if (button) button.disabled = true;
  try {
    await simulateUpload(draft.photos);
    const made = materializeFlash(draft, result.meters);
    const extra = hseFromReport(draft, made.report);
    const downMin = (draft.downtimes || []).reduce((sum, ev) => {
      const minutes = duracionMinutos(ev.start, ev.end);
      return sum + (Number.isFinite(minutes) && minutes > 0 ? minutes : 0);
    }, 0);
    const key = draftStorageKey(draft.holeId, draft.shift);
    const drafts = Object.assign({}, state.drafts || {});
    delete drafts[key];
    workingDraft = null;
    const days = extra.accidents.length ? 0 : state.daysWithoutAccidents;
    setState({
      drafts: drafts,
      flashReports: state.flashReports.concat([made.report]),
      tests: state.tests.concat(made.tests),
      downtimes: state.downtimes.concat(made.downtimes),
      photos: state.photos.concat(made.photos),
      hseObservations: state.hseObservations.concat(extra.observations),
      hseIncidents: state.hseIncidents.concat(extra.incidents),
      hseAccidents: state.hseAccidents.concat(extra.accidents),
      daysWithoutAccidents: days,
      lastSummary: {
        holeId: draft.holeId,
        shift: draft.shift,
        meters: result.meters,
        tests: made.tests.length,
        photos: made.photos.length,
        downMin: downMin
      }
    }, { refresh: ["captura", "cierre", "dashboard", "empalme"] });
    showToast(
      "Flash Report enviado",
      formatM(result.meters) + " m · " + made.tests.length + " ensayos · " + made.photos.length + " fotos · " + formatDuration(downMin)
    );
  } finally {
    busy = false;
  }
}

function emitReport() {
  const state = getState();
  const closures = readCierreClosures();
  const holeId = state.activeHoleId;
  const key = closureKey(holeId, DEMO_TODAY);
  const temp = Object.assign({}, state, { closures: closures });
  const issuer = (closures[key] && closures[key].issuer) || "";
  const result = validarCierre(temp, holeId, DEMO_TODAY, issuer);
  showMessages("cierre-errors", result.messages);
  if (!result.ok) return;
  const next = Object.assign({}, closures);
  next[key] = Object.assign({}, closures[key], { status: "emitido", issuedAt: stampNow(), issuer: issuer });
  setState({ closures: next }, { refresh: ["cierre", "dashboard", "captura"] });
  showToast("Reporte oficial emitido", "Jornada congelada a las " + horaCorta(next[key].issuedAt) + ".");
}

function moveTask(id, dir) {
  const tasks = getState().tasks.slice().sort((a, b) => a.order - b.order);
  const index = tasks.findIndex((task) => task.id === id);
  const next = index + dir;
  if (index < 0 || next < 0 || next >= tasks.length) return;
  reorderTasks(id, tasks[next].id);
}

function reorderTasks(fromId, toId) {
  if (!fromId || !toId || fromId === toId) return;
  const tasks = getState().tasks.slice().sort((a, b) => a.order - b.order).map((task) => Object.assign({}, task));
  const from = tasks.findIndex((task) => task.id === fromId);
  const to = tasks.findIndex((task) => task.id === toId);
  if (from < 0 || to < 0) return;
  const item = tasks.splice(from, 1)[0];
  tasks.splice(to, 0, item);
  tasks.forEach((task, index) => { task.order = index; });
  setState({ tasks: tasks }, { refresh: ["empalme"] });
}

function onClick(event) {
  const node = event.target.closest("[data-action]");
  if (!node) return;
  if (node.matches("select, input, textarea")) return;
  const action = node.dataset.action;
  if (action === "modal-back") {
    if (event.target === node) closeModal();
    return;
  }
  if (action === "nav") navigate(node.dataset.nav);
  else if (action === "set-shift") onShift(node.dataset.shift);
  else if (action === "toggle-theme") {
    setState({ theme: getState().theme === "light" ? "dark" : "light" }, { refresh: [] });
    const current = getState();

function onChange(event) {
  const target = event.target;
  if (target.id === "photo-input") {
    onPhotos(target.files);
    target.value = "";
