<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omajay - Control de flota v11 (Final)</title>
<style>
:root{--bg:#f3f3f1;--card:#fff;--ink:#1b1b1b;--mut:#666;--wine:#8a1c1c;--line:#e0e0dc;--g:#1d7a40;--y:#b88200;--r:#c0282d;--gb:#e1f2e7;--yb:#fbf1cf;--rb:#f8dcdd;--car:#3a3a3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a1e;--card:#22272d;--ink:#eee;--mut:#a5adb5;--wine:#e58a8a;--line:#363d45;--g:#5fd08a;--y:#f0c43c;--r:#ff7b80;--gb:#1c3a28;--yb:#463d14;--rb:#4a2226;--car:#cfd4d9}}
:root[data-theme="dark"]{--bg:#171a1e;--card:#22272d;--ink:#eee;--mut:#a5adb5;--wine:#e58a8a;--line:#363d45;--g:#5fd08a;--y:#f0c43c;--r:#ff7b80;--gb:#1c3a28;--yb:#463d14;--rb:#4a2226;--car:#cfd4d9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:42px;height:42px;border-radius:50%;background:#111;color:#fff;border:3px solid #bbb;display:grid;place-items:center;font:800 9px/1.05 sans-serif;text-align:center}
.top b{font-size:17px}.top small{display:block;color:var(--mut);font-size:12px}.sp{flex:1}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button{border:1px solid var(--line);background:none;color:var(--ink);padding:9px 14px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{background:var(--wine);color:#fff;border-color:var(--wine)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
.pres{background:var(--wine);color:#fff;padding:10px 16px;font-size:14px}.pres b{margin-right:6px}
main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.btn{border:0;border-radius:8px;background:var(--wine);color:#fff;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--r)}.btn:disabled{opacity:.45;cursor:not-allowed}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.sum div{border-radius:12px;padding:12px;text-align:center;font-size:14px}.sum b{display:block;font-size:30px}
.sg{background:var(--gb);color:var(--g)}.sy{background:var(--yb);color:var(--y)}.sr{background:var(--rb);color:var(--r)}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:96px 1fr 1fr 165px;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer}
.row:hover{border-color:var(--wine)}.car{width:92px;height:44px;color:var(--car)}
.plate{font-weight:800;font-size:18px;letter-spacing:.5px}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:13px;font-weight:600}
.pill.g{background:var(--gb);color:var(--g)}.pill.y{background:var(--yb);color:var(--y)}.pill.r{background:var(--rb);color:var(--r)}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}
input,select{display:block;width:100%;margin-top:4px;font:inherit;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.cam{height:130px;border-radius:10px;background:repeating-linear-gradient(45deg,#333,#333 10px,#3b3b3b 10px,#3b3b3b 20px);display:grid;place-items:center;color:#fff;font-size:14px;text-align:center;margin-bottom:12px;cursor:pointer;transition:transform .15s}.cam:active{transform:scale(.97)}
.cam.ok{background:var(--g);border:3px solid #fff}
.msg{padding:10px 12px;border-radius:8px;font-size:14px;margin:10px 0}.msg.e{background:var(--rb);color:var(--r)}.msg.w{background:var(--yb);color:var(--y)}
.phone{width:300px;max-width:100%;border:10px solid #222;border-radius:30px;background:#e5ddd5;padding:14px;min-height:340px}
.phone .hd{background:#075e54;color:#fff;margin:-14px -14px 12px;padding:10px 14px;font-weight:600;font-size:14px}
.bub{background:#fff;color:#111;border-radius:8px;padding:10px;font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.15);margin-bottom:10px;white-space:pre-line}
.login{max-width:420px;margin:30px auto}.who{display:flex;gap:10px;margin-bottom:14px}.who button{flex:1;padding:16px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#111;color:#fff;padding:12px 18px;border-radius:8px;font-size:15px;max-width:90%;z-index:99;box-shadow:0 5px 15px rgba(0,0,0,0.3)}
main{transition:opacity .2s ease,transform .2s ease}main.out{opacity:0;transform:translateY(-8px)}
@keyframes in{from{opacity:0;transform:translateY(15px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}}@keyframes grow{from{width:0}}
.view>*{animation:in .4s cubic-bezier(.22,.8,.3,1) both}
.view>:nth-child(2){animation-delay:.06s}.view>:nth-child(3){animation-delay:.12s}.view>:nth-child(4){animation-delay:.18s}.view>:nth-child(5){animation-delay:.24s}.view>:nth-child(6){animation-delay:.3s}.view>:nth-child(n+7){animation-delay:.36s}
.fade{animation:fd .6s ease both}.bar i{animation:grow .9s cubic-bezier(.22,.8,.3,1) both}.toast{animation:in .35s both}
.row{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.row:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.1)}
.btn,nav button{transition:transform .15s ease,opacity .2s ease,background .25s ease,color .25s ease,border-color .25s ease}.btn:active{transform:scale(.97)}
.logo{background:#fff;border:0;display:block;object-fit:contain;width:46px;height:46px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}.num{text-align:center}tr[data-c]{cursor:pointer}tr[data-c]:hover{background:var(--bg)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:720px){.row{grid-template-columns:80px 1fr}.row>:nth-child(n+3){grid-column:1/3}.g2{grid-template-columns:1fr}.car{width:76px}}

/* Estilos para el vehículo bloqueado */
.row.locked { opacity: 0.6; cursor: not-allowed; border-color: transparent; }
.row.locked:hover { transform: none; box-shadow: none; border-color: transparent; }
.row.locked .car { color: #aaa; }

/* Estilos para etiquetas de checklist seleccionadas */
.ztag[data-sel="1"] { background-color: var(--r); color: #fff; border-color: var(--r); }
</style></head><body>

<nav id="nav" role="tablist"></nav><div class="pres" id="pres"></div><main id="v"></main>

    const mod = a.filter(x=>x.g==="Moderado").length;

    const h=[0,1,2,3,4,5].map(i=> Math.round(f.kd * 7 * (0.85 + Math.abs(Math.sin(f.p.charCodeAt(0) + i)) * 0.3)));
    const mx=Math.max(...h),mn=0;
    const cs=U.filter(u=>u.r==="Conductor"&&u.on).map(u=>u.n);
    
    return `<button class="btn alt" id="back">← Volver al panel</button>
    <div style="display:flex;gap:14px;align-items:center;margin:14px 0">${car(f.t)}<div><h1>${f.p}</h1><span class="mut">${f.m}</span></div></div>
    <div class="g2">
        <div class="card">
            <h2>Datos Operativos</h2>
            <div class="kv"><span>Kilometraje actual</span><b>${N(f.km)} km</b></div>
            <div class="kv"><span>Último mantenimiento</span><b>${N(f.last)} km</b></div>
            <div class="kv" style="border-bottom:none;padding-bottom:0"><span>Próximo taller</span><b>${N(f.last+INT)} km</b></div>
            <div style="margin-bottom:12px; border-bottom:1px solid var(--line); padding-bottom:12px">
                <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:6px;margin-bottom:4px"><span>Desgaste del aceite</span><span>${Math.round(k.pct)}%</span></div>
                <div class="bar" style="height:10px"><i style="width:${k.pct}%;background:${col[k.s]}"></i></div>
            </div>
            <div class="kv"><span>Promedio de uso diario</span><b>${f.kd} km/día</b></div>
            <div class="kv"><span>El sistema pide Km cada</span><b>${freq(f)} ${freq(f)===1?'día':'días'}</b></div>
            <div class="kv"><span>Días para próximo taller</span><b>${k.left<=0?"Ya venció":"≈ "+k.days+" "+(k.days===1?"día":"días")}</b></div>
            
            <label style="margin-top:16px">Conductor de hoy<select id="asg"><option value="">Sin asignar</option>${cs.map(n=>`<option ${AS[f.p]===n?"selected":""}>${n}</option>`).join("")}</select></label>
            
        </div>
        
        <div class="card" style="display:flex;flex-direction:column">
            <h2>Distancia recorrida por semana</h2>
            <p class="mut" style="margin-top:-6px;font-size:13px">Kilómetros netos (últimas 6 semanas)</p>
            <svg viewBox="0 0 300 130" width="100%" role="img" aria-label="Kilometraje recorrido por semana">
                ${h.map((v,i)=>{
                    const ht=(v/mx)*80;
                    const x=8+i*48;
                    return `<rect x="${x}" y="${108-ht}" width="36" height="${ht}" rx="3" fill="var(--y)"/><text x="${x+18}" y="${103-ht}" font-size="9" font-weight="700" text-anchor="middle" fill="currentColor">${N(v)}</text><text x="${x+18}" y="122" font-size="9" text-anchor="middle" fill="currentColor">Sem ${i+1}</text>`
                }).join("")}
            </svg>
            
            <div style="margin-top:auto; padding:12px; background:var(--bg); border-radius:8px">
                <label style="margin-bottom:4px; font-size:13px">Aviso de alerta administrativa en taller:</label>
                <div style="display:flex; gap:8px">
                    <input type="number" id="ev" value="${f.ev}" min="1" style="flex:1; margin:0"> 
                    <button class="btn alt" id="sev" style="margin:0">Guardar días</button>
                </div>
            </div>
        </div>
    </div>
    <div class="card">
        <h2>Historial y Documentos</h2>
        <div class="kv"><span>Registro de kilometraje</span><span class="mut">${N(f.km)} km · ${f.reg===0?"hoy":"hace "+f.reg+" días"}</span></div>
        <div class="kv"><span>Mantenimiento: aceite y filtros</span><span class="mut">${N(f.last)} km · Taller Central</span></div>
        <div class="kv"><span>Vencimiento SOAT</span><b style="color:${f.soat<=7?'var(--r)':f.soat<=30?'var(--y)':'var(--g)'}">${fechaVencimiento(f.soat)} (en ${f.soat} días)</b></div>
        <div class="kv"><span>Vencimiento Revisión Técnica</span><b style="color:${f.rt<=7?'var(--r)':f.rt<=30?'var(--y)':'var(--g)'}">${fechaVencimiento(f.rt)} (en ${f.rt} días)</b></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="mant">Registrar visita a taller</button>
        <button class="btn alt" id="vermap">📍 Ver ubicación</button>
        <button class="btn alt" id="bj">Dar de baja</button>
    </div>`
}

function conductores(){const ns=Object.keys(DR).sort((a,b)=>srt==="g"?stat(b).g-stat(a).g:srt==="tot"?stat(b).t-stat(a).t:stat(b).r-stat(a).r);
return`<h1>Conductores y accidentes</h1><p class="mut">El ratio penaliza más los choques graves para una lectura justa del riesgo. Es un resumen administrativo.</p>
<div class="tools"><button class="btn" id="nacc">+ Registrar accidente</button><select id="srt" aria-label="Ordenar" style="max-width:260px;margin:0"><option value="rate" ${srt==="rate"?"selected":""}>Ordenar: Ratio Riesgo</option><option value="g" ${srt==="g"?"selected":""}>Ordenar: más graves</option><option value="tot" ${srt==="tot"?"selected":""}>Ordenar: total</option></select></div>
<div class="card" style="overflow-x:auto"><table><tr><th>Conductor</th><th class="num">Km</th><th class="num">Leves</th><th class="num">Moderados</th><th class="num">Graves</th><th class="num">Ratio de Riesgo<br><small style="font-size:10px;font-weight:normal">(Fórmula Ponderada)</small></th></tr>
${ns.map(n=>{const t=stat(n);return`<tr data-c="${n}"><td><b>${n}</b></td><td class="num">${N(DR[n].km)}</td><td class="num">${t.l}</td><td class="num">${t.m}</td><td class="num">${t.g?`<span class="pill r">${t.g}</span>`:0}</td><td class="num"><b>${t.r.toFixed(1)}</b></td></tr>`}).join("")}</table></div><p class="mut">Toque un conductor para ver su ficha. Dato sensible: solo lo ve Administración.</p>`}

function mi(){
  const mine=Object.keys(AS).find(p=>AS[p]===me.n),nm=me.n.split(" ")[0];

      </label>

  `}
  `;
}

function mant(f){return`<button class="btn alt" id="back">← Volver</button><h1 style="margin-top:12px">Mantenimiento: ${f.p}</h1><div class="card" style="max-width:520px">

<label>Taller<input value="Taller Central, La Victoria"></label><label>Costo (S/)<input type="number" value="480"></label><label>Kilometraje del servicio<input type="number" id="mk" value="${f.km}"></label>

<label style="display:flex;gap:8px;align-items:center;margin:16px 0;font-size:13px;padding:12px;background:var(--yb);border-radius:8px;color:var(--y)">

</label>
<button class="btn" id="sv" style="background:#999;color:#ddd" disabled>Registrar visita a taller</button></div>`}

function registro(){
if(pend){const f=F.find(x=>x.p===pend);return`<button class="btn alt" id="back">← Volver a la lista</button><h1 style="margin-top:12px">${f.p}</h1><div class="card" style="max-width:480px">
<div class="cam">📷 Aquí se abre la cámara<br>para foto del tablero</div><p class="mut">Último dato: ${N(f.km)} km</p>
<label>Kilometraje que muestra el tablero<input type="number" inputmode="numeric" id="kmin" placeholder="Ej. ${N(f.km+f.kd)}"></label>

const row=f=>{const r=rg(f);return`<button class="row" data-r="${f.p}">${car(f.t)}<span><span class="plate">${f.p}</span><br><span class="mut">${f.m}</span></span><span class="mut">${N(f.km)} km<br>Se registra cada ${freq(f)} día(s)</span><span><span class="pill ${r[0]}">${r[1]}</span></span></button>`};
const T=F.filter(f=>f.reg>=freq(f)).sort((a,b)=>b.reg-a.reg),Rr=F.filter(f=>f.reg<freq(f));
return`<h1>Registro manual de fin de jornada</h1><p class="mut">El sistema calcula qué camionetas hay que registrar hoy según su uso y su cercanía al mantenimiento.</p><h2>Toca registrar hoy (${T.length})</h2>${T.length?T.map(row).join(""):'<div class="card mut">No hay pendientes.</div>'}<h2 style="margin-top:20px">No hace falta hoy (${Rr.length})</h2>${Rr.map(row).join("")}`}

function bajas(){return`<h1>Camionetas dadas de baja</h1><p class="mut">Queda registrado quién la dio de baja y cuándo.</p>${B.length?B.map((b,i)=>`<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${car(b.f.t)}<div style="flex:1"><b class="plate">${b.f.p}</b><br><span class="mut">${b.motivo} · por ${b.por} ·${b.fecha}</span></div><button class="btn alt" data-re="${i}" onclick="toast('¿Reactivar? Deshaciendo baja...')">Reactivar</button></div>`).join(""):'<div class="card mut">Aún no hay bajas. Pruebe dar de baja una camioneta desde su detalle.</div>'}`}
function agregar(){return`<h1>Agregar camioneta</h1><p class="mut">Disponible para Administración.</p><div class="card" style="max-width:520px">
<label>Placa<input id="np" placeholder="Ej. XYZ-123"></label><label>Tipo<select id="nt"><option value="p">Camioneta 4x4</option><option value="c">Camioneta cerrada</option><option value="v">Mini van</option></select></label>
<label>Modelo<input id="nm" value="Toyota Hilux 4x4"></label><label>Foto de la unidad<input type="file" accept="image/*"></label><label>Kilometraje actual<input type="number" id="nk" placeholder="Ej. 12000"></label>
<label>Km del último mantenimiento<input type="number" id="nl" placeholder="Ej. 10000"></label><label>Uso estimado (km/día)<input type="number" id="nu" placeholder="Ej. 150"></label><label>Intervalo de mantenimiento (km)<input type="number" value="5000"></label><div id="er"></div><button class="btn" id="ad">Agregar al inventario</button></div>`}
function baja(f){return`<button class="btn alt" id="back">← Volver</button><h1 style="margin-top:12px">Dar de baja ${f.p}</h1><div class="card" style="max-width:520px">
<label>Motivo<select><option>Vendida</option><option>Siniestro total</option><option>Fin de contrato</option></select></label>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ck" style="width:auto;margin:0"> Confirmo que esta camioneta sale de la flota</label>
<p class="mut">Se conserva todo su historial. Quedará registrado quién y cuándo, y se avisará a Administración.</p><button class="btn red" id="bg" disabled>Dar de baja</button></div>`}
function wa(){const f=[...F].sort((a,b)=>calc(a).days-calc(b).days)[0],k=calc(f);
return`<h1>Aviso por WhatsApp</h1><p class="mut">Así le llegaría a Administración. Ejemplo con datos de la maqueta.</p><div class="phone"><div class="hd">Control de flota Omajay</div>
<div class="bub">🟡 Mantenimiento próximo\n${f.p} · ${f.m}\nKilometraje: ${N(f.km)} km\n${k.left<=0?"Se pasó "+N(-k.left)+" km.":"Faltan "+N(k.left)+" km (≈ "+k.days+" días)."}\nPrograme el servicio esta semana.</div>
<div class="bub">⚠️ Sin registro de kilometraje\nF7K-228 lleva 9 días sin dato.</div><div class="bub">🗑️ Baja registrada\nUna camioneta fue dada de baja por Administración.</div></div>`}
function render(){const k0=view+"|"+pend+"|"+sel+"|"+mconf+"|"+csel;if(window._k!==undefined&&k0!==window._k&&!window._busy){window._busy=true;const m=document.getElementById("v");m.classList.add("out");setTimeout(()=>{window._busy=false;m.classList.remove("out");_render()},200);return}_render()}
function _render(){const nv=document.getElementById("nav");
document.getElementById("who").textContent=me?me.n+" · "+role:"";const ob=document.getElementById("out");ob.style.display=role?"":"none";ob.onclick=()=>{role=null;me=null;view="login";sel=null;pend=null;mconf=null;render()};
const TT=role==="Administración"?tabs:[];nv.style.display=TT.length?"flex":"none";nv.innerHTML=TT.map(([k,l])=>`<button role="tab" aria-selected="${view===k||(k==="panel"&&["detalle","mant","baja"].includes(view))||(k==="conductores"&&["ficha","acc"].includes(view))}" data-k="${k}">${l}</button>`).join("");
nv.querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.k;sel=null;pend=null;render()});
const e=expl[view]||expl["mi"];const pr=document.getElementById("pres");pr.style.display=showP?"block":"none";pr.innerHTML=`<b>${e[0]}:</b>${e[1]}`;
const v=document.getElementById("v"),f=F.find(x=>x.p===sel);const key=view+"|"+pend+"|"+sel+"|"+mconf+"|"+csel;if(key!==window._k){window._k=key;const p2=document.getElementById("pres");p2.classList.remove("fade");void p2.offsetWidth;p2.classList.add("fade");v.classList.remove("view");void v.offsetWidth;v.classList.add("view")}
if(view==="login"){v.innerHTML=`<div class="login card" style="text-align:center"><img class="logo" style="width:110px;height:110px;margin:0 auto 10px" src="${LOGO}" alt="Omajay Rent a Car"><h1>Ingresar</h1><p class="mut">Control de flota</p><div style="text-align:left"><label>Usuario<input id="lu" autocapitalize="none" autocomplete="off"></label><label>PIN<input id="lp" type="password" inputmode="numeric" maxlength="4"></label></div><div id="er"></div><button class="btn" id="li" style="width:100%">Entrar</button><p class="mut" style="margin-top:14px">Demostración: acceso rápido</p><div class="who"><button class="btn alt" data-d="admin">Administración</button><button class="btn alt" data-d="psalas">Conductor</button></div></div>`;
const dl=(u,p)=>{const x=U.find(y=>y.u===u.trim().toLowerCase()&&y.pin===p),er=v.querySelector("#er");if(!x){er.innerHTML='<div class="msg e">Usuario o PIN incorrecto.</div>';return}if(!x.on){er.innerHTML='<div class="msg e">Este usuario está desactivado.</div>';return}me=x;role=x.r;view=role==="Conductor"?"mi":"panel";mconf=null;render()};
v.querySelector("#li").onclick=()=>dl(v.querySelector("#lu").value,v.querySelector("#lp").value);
v.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const x=U.find(y=>y.u===b.dataset.d);dl(x.u,x.pin)});return}
v.innerHTML={panel:panel,registro:registro,agregar:agregar,wa:wa,bajas:bajas,mapa:mapa,conductores:conductores,ficha:ficha,acc:accForm,usuarios:usuarios,mi:mi,checklist:checklist,sos:sosView,cierre:cierre,detalle:()=>detalle(f),mant:()=>mant(f),baja:()=>baja(f)}[view]();
const q=(s,fn)=>{const x=v.querySelector(s);if(x)x.onclick=fn},go=(w)=>{view=w;render();scrollTo(0,0)};
v.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{sel=b.dataset.p;go("detalle")});
v.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{pend=b.dataset.r;warned=false;render();scrollTo(0,0)});
const qi=v.querySelector("#q");if(qi)qi.oninput=e=>{qv=e.target.value.replace(/"/g,"");render();const i=document.getElementById("q");i.focus();i.setSelectionRange(qv.length,qv.length)};
const fo=v.querySelector("#fs");if(fo)fo.onchange=e=>{fs=e.target.value;render()};
v.querySelectorAll("[data-g]").forEach(g=>g.onclick=()=>{gsel=g.dataset.g;render()});q("#vermap",()=>{gsel=sel;go("mapa")});
const as=v.querySelector("#asg");if(as)as.onchange=()=>{const n=as.value;Object.keys(AS).forEach(p=>{if(AS[p]===n)delete AS[p]});if(n)AS[f.p]=n;else delete AS[f.p];toast(n?n+" usa hoy la "+f.p:"Camioneta "+f.p+" sin asignar")};
v.querySelectorAll("[data-c]").forEach(r=>r.onclick=()=>{csel=r.dataset.c;go("ficha")});q("#nacc",()=>go("acc"));const so=v.querySelector("#srt");if(so)so.onchange=e=>{srt=e.target.value;render()};
q("#sacc",()=>{const n=v.querySelector("#ac").value,t=v.querySelector("#at").value.trim(),er=v.querySelector("#er");if(!t){er.innerHTML='<div class="msg e">Escriba una descripción breve.</div>';return}
 DR[n].acc.push({d:v.querySelector("#fd").value.split("-").reverse().join("/"),p:v.querySelector("#ap").value,g:v.querySelector("#ag").value,t,c:+v.querySelector("#co").value||0});csel=n;toast("Accidente registrado en la ficha de "+n);go("ficha")});
q("#cu",()=>{const n=v.querySelector("#un").value.trim(),u=v.querySelector("#uu").value.trim().toLowerCase(),p=v.querySelector("#up").value.trim(),r=v.querySelector("#ur").value,er=v.querySelector("#er");
 if(!n||!/^[a-z0-9._]+$/.test(u)){er.innerHTML='<div class="msg e">Escriba el nombre y un usuario sin espacios ni tildes.</div>';return}
 if(U.some(x=>x.u===u)){er.innerHTML='<div class="msg e">Ese nombre de usuario ya existe.</div>';return}
 if(!/^\d{4}$/.test(p)){er.innerHTML='<div class="msg e">El PIN debe tener 4 números.</div>';return}
 U.push({n,u,pin:p,r,on:1});if(r==="Conductor")DR[n]={km:0,uso:[],acc:[]};toast("Usuario "+u+" creado");render()});
v.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>{const x=U[+b.dataset.rp];x.pin=String(1000+Math.floor(Math.random()*9000));toast("Nuevo PIN de "+x.n+": "+x.pin+" (se muestra una sola vez)")});
v.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{const x=U[+b.dataset.tg];if(x===me){toast("No puede desactivar su propio usuario");return}x.on=x.on?0:1;render()});
v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mconf=b.dataset.m;render()});q("#mno",()=>{mconf=null;render()});

// BOTON SOS
q("#msos",()=>{view="sos";render()});
q("#sos_back",()=>{view="mi";render()});

// LÓGICA CHECKLIST MULTI-OPCIÓN Y FOTO
q("#mok",()=>{
  view="checklist";
  chk={f:0,c:0,i:0,d:0,p:0};
  chkZ=null; chkTxt=null; chkSel=[]; fotoTomada=false;
  render();
});
if(view==="checklist"){
  q("#cx",()=>{view="mi";render()});
  v.querySelectorAll("[data-z]").forEach(el=>el.onclick=()=>{chkZ=el.dataset.z;chkTxt=null;chkSel=[];fotoTomada=false;render()});
  q("#zok",()=>{chk[chkZ]=1;chkZ=null;render()});
  
  q("#zbad",()=>{chkTxt='tag';chkSel=[];fotoTomada=false;render()});
  
  v.querySelectorAll(".ztag").forEach(el=>el.onclick=()=>{
     const t = el.dataset.t;
     if(chkSel.includes(t)) {
         chkSel = chkSel.filter(x => x !== t);
     } else {
         chkSel.push(t);
     }
     // Validar si activamos botón guardar
     const btn = v.querySelector("#zsavetags");
     if(btn) {
         if(chkSel.length > 0 && fotoTomada) { btn.disabled = false; btn.style.background = 'var(--r)'; btn.style.color = '#fff'; } 
         else { btn.disabled = true; btn.style.background = '#999'; btn.style.color = '#ddd'; }
     }
     render();
  });
  
  q("#zbtnfoto_tag",()=>{
      fotoTomada = true; 
      toast('📸 Cámara abierta. Foto guardada temporalmente.');
      v.querySelector("#foto_ok_tag").style.display = "block";
      v.querySelector("#zbtnfoto_tag").style.display = "none";
      const btn = v.querySelector("#zsavetags");
      if(chkSel.length > 0) { btn.disabled = false; btn.style.background = 'var(--r)'; btn.style.color = '#fff'; }
  });
  
  q("#zbtnfoto_txt",()=>{
      fotoTomada = true; 
      toast('📸 Cámara abierta. Foto guardada temporalmente.');
      v.querySelector("#foto_ok_txt").style.display = "block";
      v.querySelector("#zbtnfoto_txt").style.display = "none";
      const btn = v.querySelector("#zbadok");
      btn.disabled = false; btn.style.background = 'var(--r)'; btn.style.color = '#fff';
  });
  
  q("#zsavetags",()=>{
     if(chkSel.length > 0 && fotoTomada) {
         chk[chkZ]=2; 
         toast("Daños reportados: " + chkSel.join(", ")); 
         chkZ=null; chkSel=[]; fotoTomada=false; render();
     }
  });
  
  q("#zot",()=>{chkTxt='txt';fotoTomada=false;render()});
  
  q("#zcn",()=>{chkZ=null;chkTxt=null;chkSel=[];fotoTomada=false;render()});
  q("#zbadok",()=>{
     const txt = v.querySelector("#ztxt").value.trim();
     if(!txt){ toast("Por favor escriba una descripción del daño."); return; }
     if(!fotoTomada){ toast("Debe tomar una foto de evidencia."); return; }
     chk[chkZ]=2; toast("Daño reportado: "+txt); chkZ=null; fotoTomada=false; render();
  });
  
  // Firma legal final
  const chkL = v.querySelector("#chk_legal");
  if(chkL) {
      chkL.onchange = () => {
          const btn = v.querySelector("#cdone");
          if(chkL.checked) { btn.disabled = false; btn.style.background = 'var(--wine)'; btn.style.color = '#fff'; }
          else { btn.disabled = true; btn.style.background = '#999'; btn.style.color = '#ddd'; }
      };
  }
  
  q("#cdone",()=>{
     AS[mconf]=me.n;
     const d=DR[me.n]; if(d&&!d.uso.includes(mconf)) d.uso.push(mconf);
     toast("Inspección guardada y firmada. Llave virtual entregada.");
     mconf=null; view="mi"; render();
  });
}

// CIERRE DE TURNO
q("#mrel",()=>{ view="cierre"; fotoTomada=false; render(); });
if(view==="cierre"){
  q("#cx_cierre", ()=>{view="mi"; render();});
  
  q("#btn_foto_km", ()=>{
      fotoTomada = true;
      toast('📸 Cámara abierta. Foto del odómetro guardada.');
      v.querySelector("#foto_ok").style.display = "block";
      v.querySelector("#btn_foto_km").style.display = "none";
      const btn = v.querySelector("#scierre");
      btn.disabled = false; btn.style.background = 'var(--wine)'; btn.style.color = '#fff';
  });

  q("#scierre", ()=>{
     const mine=Object.keys(AS).find(p=>AS[p]===me.n);
     const f=F.find(x=>x.p===mine);
     const k = +v.querySelector("#kfin").value;
     const er = v.querySelector("#er_cierre");
     if(!fotoTomada) { er.innerHTML='<div class="msg e">Debe tomar la foto del tablero.</div>'; return; }
     if(!k) { er.innerHTML='<div class="msg e">Debe digitar el kilometraje final.</div>'; return; }
     if(k < f.km) { er.innerHTML='<div class="msg e">El kilometraje no puede ser menor al inicial ('+N(f.km)+').</div>'; return; }
     
     f.kd = Math.max(10, Math.round((f.kd + (k - f.km)) / 2));
     f.km = k;
     f.reg = 0; 
     delete AS[mine];
     
     toast("Jornada terminada. Kilometraje actualizado a "+N(k)+" km.");
     view="mi"; render();
  });
}

q("#back",()=>{if(view==="registro"){pend=null;render()}else go(view==="detalle"?"panel":["ficha","acc"].includes(view)?"conductores":"detalle")});

q("#sev",()=>{f.ev=Math.max(1,+v.querySelector("#ev").value||14);toast("Aviso de alerta administrativa guardado");render()});
v.querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>{const x=B.splice(+b.dataset.re,1)[0];F.push(x.f);toast(x.f.p+" reactivada");render()});q("#bj",()=>go("baja"));

// CHECKBOX EN MANTENIMIENTO

    }
}
q("#sv",()=>{f.last=+v.querySelector("#mk").value||f.km;toast("Mantenimiento guardado. El desgaste de aceite volvió a 0%.");go("detalle")});

q("#bg",()=>{B.push({f,por:me.n,fecha:new Date().toLocaleString("es-PE",{dateStyle:"short",timeStyle:"short"}),motivo:v.querySelector("select").value});F=F.filter(x=>x!==f);toast("Baja registrada por "+me.n+". Aviso enviado a Administración.");sel=null;go("panel")});
const ck=v.querySelector("#ck");if(ck)ck.onchange=()=>v.querySelector("#bg").disabled=!ck.checked;
q("#gu",()=>{const f2=F.find(x=>x.p===pend),n=+v.querySelector("#kmin").value,er=v.querySelector("#er");
 if(!n){er.innerHTML='<div class="msg e">Escriba el kilometraje del tablero.</div>';return}
 if(n<f2.km){er.innerHTML=`<div class="msg e">El número es menor al último registro (${N(f2.km)} km). Revise la foto.</div>`;return}
 if(n-f2.km>1500&&!warned){warned=true;er.innerHTML=`<div class="msg w">Son ${N(n-f2.km)} km más que el último registro. ¿Es correcto? Toque de nuevo para confirmar.</div>`;return}
 if(f2.reg>0)f2.kd=Math.max(10,Math.round((f2.kd+(n-f2.km)/f2.reg)/2));f2.km=n;f2.reg=0;toast("Registrado: "+f2.p+" · "+N(n)+" km · "+me.n+" · hoy");pend=null;render()});
q("#ad",()=>{const p=v.querySelector("#np").value.trim().toUpperCase(),k=+v.querySelector("#nk").value,l=+v.querySelector("#nl").value,er=v.querySelector("#er");
 if(!p||!k||!l||F.some(x=>x.p===p)){er.innerHTML='<div class="msg e">Complete placa, kilometraje y último mantenimiento. La placa no debe estar repetida.</div>';return}
 F.push({p,m:v.querySelector("#nm").value,t:v.querySelector("#nt").value,km:k,last:l,kd:+v.querySelector("#nu").value||150,ev:14,cond:"",reg:0,soat:365,rt:365});toast("Camioneta "+p+" agregada al inventario");go("panel")});
}
document.getElementById("pt").onclick=()=>{showP=!showP;document.getElementById("pt").textContent=showP?"Ocultar explicación":"Mostrar explicación";render()};
render();
